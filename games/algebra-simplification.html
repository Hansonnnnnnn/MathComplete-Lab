    function termToString(coef, variable, isFirst){
      if(coef === 0) return "";
      const sign = coef < 0 ? "-" : "+";
      const abs = Math.abs(coef);
      let body = "";
      if(variable === "") body = String(abs);
      else if(abs === 1) body = variable;
      else body = `${abs}${variable}`;

      if(isFirst) return coef < 0 ? `-${body}` : body;
      return coef < 0 ? ` - ${body}` : ` + ${body}`;
    }

    function polyToString(terms){
      const order = ["xÂ²","yÂ²","xy","x","y",""];
      let parts = [];
      order.forEach(v => {
        const coef = terms[v] || 0;
        if(coef !== 0) parts.push(termToString(coef, v, parts.length === 0));
      });
      return parts.length ? parts.join("") : "0";
    }

    function makeQ(difficulty,type,expr,expanded,answerTerms,distractors){
      const answer = polyToString(answerTerms);
      const q = {
        difficulty,
        type,
        main: expr,
        plain: expr,
        extra: "",
        answer: ans(answer),
        expanded,
        answerTerms,
        distractors: [...new Set(distractors.filter(x => x && x !== answer))]
      };
      q.options = GAME.options(q, Number(optionCountEl.value || 4));
      return q;
    }

    function signedConst(n){
      return n >= 0 ? ` + ${n}` : ` - ${Math.abs(n)}`;
    }

    function signedTerm(coef, variable){
      return coef >= 0 ? ` + ${Math.abs(coef)}${variable}` : ` - ${Math.abs(coef)}${variable}`;
    }

      generateQuestion(difficulty, forcedType=null){

        if(forcedType){
          const matched = builders.filter(fn => {
            const q = fn();
            return q.type === forcedType;
          });

      options(q,count){
        const correct = q.answer;

        const addDistractor = value => {
          const item = ans(value);
          if(answerKey(item) !== answerKey(correct)) distractors.set(answerKey(item), item);

        q.distractors.forEach(addDistractor);

        while(distractors.size < count - 1){
          const random = choose(["x","2x","x + 1","x - 1","2x + 1","xÂ² + x","0"]);
          addDistractor(random);
        }

        return shuffle([
          correct,
          ...shuffle([...distractors.values()]).slice(0,count-1)
        ]);
      },

    function splitTopLevel(input, delimiter){
      const parts = [];
      let depth = 0;
      let start = 0;
      for(let i = 0; i < input.length; i++){
        const ch = input[i];
        if(ch === "(") depth++;
        else if(ch === ")") depth = Math.max(0, depth - 1);
        else if(ch === delimiter && depth === 0){
          parts.push(input.slice(start, i).trim());
          start = i + 1;
        }
      }
      parts.push(input.slice(start).trim());
      return parts.filter(Boolean);
    }

    function findTopLevel(input, target){
      let depth = 0;
      for(let i = 0; i < input.length; i++){
        const ch = input[i];
        if(ch === "(") depth++;
        else if(ch === ")") depth = Math.max(0, depth - 1);
        else if(ch === target && depth === 0) return i;
      }
      return -1;
    }

    function stripOuterParens(input){
      const s = String(input).trim();
      if(!s.startsWith("(") || !s.endsWith(")")) return s;
      let depth = 0;
      for(let i = 0; i < s.length; i++){
        if(s[i] === "(") depth++;
        if(s[i] === ")") depth--;
        if(depth === 0 && i < s.length - 1) return s;
      }
      return s.slice(1, -1).trim();
    }

    function escapeLatexText(text){

    function mathToLatex(expr){
      let s = String(expr ?? "").trim();
      if(!s) return "";

      s = s
        .replace(/âˆ’/g, "-")
        .replace(/Ã—/g, "\\times ")
        .replace(/Â·/g, "\\cdot ")
        .replace(/\u00a0/g, " ");

      const pureText = {
        "No solution": "\\text{No solution}",
        "Infinitely many solutions": "\\text{Infinitely many solutions}",
        "No answer: time is up": "\\text{No answer: time is up}",
        "æ— è§£": "\\text{æ— è§£}",
        "æ— ç©·å¤šä¸ªè§£": "\\text{æ— ç©·å¤šä¸ªè§£}",
        "æœªä½œç­”ï¼ˆæ—¶é—´åˆ°ï¼‰": "\\text{æœªä½œç­”ï¼ˆæ—¶é—´åˆ°ï¼‰}"
      };
      if(pureText[s]) return pureText[s];

      const colonMatch = s.match(/^([A-Za-z\u4e00-\u9fff ]+):\s*(.+)$/);
      if(colonMatch){
        return `\\text{${escapeLatexText(colonMatch[1] + ": ")}}${mathToLatex(colonMatch[2])}`;
      }

      const commaParts = splitTopLevel(s, ",");
      if(commaParts.length > 1){
        return commaParts.map(part => mathToLatex(part)).join(",\\quad ");
      }

      const equalParts = splitTopLevel(s, "=");
      if(equalParts.length > 1){
        return equalParts.map(part => mathToLatex(part)).join(" = ");
      }

      const slashIndex = findTopLevel(s, "/");
      if(slashIndex > -1){
        const numerator = stripOuterParens(s.slice(0, slashIndex));
        const denominator = stripOuterParens(s.slice(slashIndex + 1));
        return `\\frac{${mathToLatex(numerator)}}{${mathToLatex(denominator)}}`;
      }

      s = s.replace(/\*/g, "\\cdot ");
      s = s.replace(/\bof\b/g, "\\text{ of }");
      s = s.replace(/%/g, "\\%");
      s = s.replace(/Ï€/g, "\\text{Ï€}");
      s = s.replace(/\?/g, "?");

      s = s.replace(/sqrt\(([^()]*)\)/g, (_, inner) => `\\sqrt{${mathToLatex(inner)}}`);
      s = s.replace(/sec\^2\(([^()]*)\)/g, (_, inner) => `\\sec^{2}\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/(sin|cos|tan|sec|ln)\(([^()]*)\)/g, (_, fn, inner) => `\\${fn}\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/f\(g\(([^()]*)\)\)/g, (_, inner) => `f\\left(g\\left(${mathToLatex(inner)}\\right)\\right)`);
      s = s.replace(/g\(f\(([^()]*)\)\)/g, (_, inner) => `g\\left(f\\left(${mathToLatex(inner)}\\right)\\right)`);
      s = s.replace(/f\(([^()]*)\)/g, (_, inner) => `f\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/g\(([^()]*)\)/g, (_, inner) => `g\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/e\^\(([^()]*)\)/g, (_, inner) => `e^{${mathToLatex(inner)}}`);
      s = s.replace(/e\^x/g, "e^{x}");

      s = s.replace(/\^\(([^)]+)\)/g, (_, exponent) => `^{${mathToLatex(exponent)}}`);
      s = s.replace(/\^(-?\d+)/g, "^{$1}");
      s = s.replace(/\^([a-zA-Z]+)/g, "^{$1}");
      s = s.replace(/([a-zA-Z])Â²/g, "$1^{2}");
      s = s.replace(/([a-zA-Z])Â³/g, "$1^{3}");

      s = s.replace(/x\^\{1\}/g, "x");
      s = s.replace(/x\^\{0\}/g, "1");
      s = s.replace(/\bln\b/g, "\\ln");
      s = s.replace(/(^|[^A-Za-z])pi(?![A-Za-z])/g, "$1\\text{Ï€}");

      return s;
    }

    function shouldRenderMath(expr){
      const s = String(expr ?? "").trim();
      if(!s) return false;
      if(["No solution","Infinitely many solutions","æ— è§£","æ— ç©·å¤šä¸ªè§£"].includes(s)) return true;
      if(/[=^/*+\-()Ï€%Â²Â³]/.test(s)) return true;
      if(/^\s*-?\d+(\.\d+)?\s*$/.test(s)) return true;
      if(isSimpleMonomial(s)) return true;
      if(/^[A-Za-z]\s*\(/.test(s)) return true;
      return false;
    }

    function isSimpleMonomial(expr){
      const compact = String(expr ?? "").replace(/\s+/g, "");
      if(!/^-?(?:\d+(?:\.\d+)?)?[A-Za-z]{1,4}$/.test(compact)) return false;
      const letters = compact.replace(/^-?(?:\d+(?:\.\d+)?)?/, "");
      if(!letters) return false;
      if(/^(sin|cos|tan|sec|log|ln|area|base|rate|time|easy|hard)$/i.test(letters)) return false;
      return /\d/.test(compact) || /^[xyzabcmnptuv]/i.test(letters) || letters.length <= 2;
    }

          : (lang === "zh" ? "é”™è¯¯ã€‚æ­£ç¡®ç­”æ¡ˆæ˜¯" : "Incorrect. The correct answer is");
        feedbackEl.innerHTML = `${prefix} ${mathSpan(answer, "feedback-math")}.`;
        renderTaggedMath(feedbackEl);
        feedbackEl.classList.add("bad");
      }
    }

    function renderSolutionBox(){
      const q = quiz[currentIndex];
      if(!q || !answered){
        solutionBox.classList.add("hidden");
        solutionBox.innerHTML = "";
        return;
      }

      const lines = GAME.solutionLines(q);
      const correct = answerToString(correctAnswer(q));
      solutionBox.classList.remove("hidden");
      solutionBox.innerHTML = `
        <h4>${tr().solutionTitle}</h4>
        <div class="solution-chain">
          ${lines.map(s => `
            <div class="chain-line">
              ${mathSpan(s.line, "chain-math")}
              <span class="chain-note">${escapeHtml(s.note || "")}</span>
            </div>
          `).join("")}
        </div>
        <div class="solution-answer">${tr().solutionFinal} ${mathSpan(correct, "answer-math")}</div>
      `;
      renderTaggedMath(solutionBox);
    }

    function chooseOption(button, selected){
      if(answered) return;
      answered = true;
      clearTimer();

      const q = quiz[currentIndex];
      const correct = correctAnswer(q);
      const correctDisplay = answerToString(correct);
      const buttons = [...optionsEl.querySelectorAll(".option")];

      buttons.forEach(btn => {
        btn.disabled = true;
        if(btn.dataset.answerKey === answerKey(correct)) btn.classList.add("correct");
      });

      if(isSameAnswer(selected, correct)){
        correctCount++;
        lastFeedback = { correct:true, answer:correctDisplay, timeUp:false };
        renderFeedback(true, correctDisplay, false);
      } else {
        button.classList.add("wrong");
        lastFeedback = { correct:false, answer:correctDisplay, timeUp:false };
        renderFeedback(false, correctDisplay, false);
        wrongAnswers.push({
          main: q.plain,
          answer: correctDisplay,
          selected: answerToString(selected),
          options: optionPayload(q, selected),
          type: q.type,
          difficulty: q.difficulty
        });
      }

      const options = optionPayload(q, selected);
      void window.MCLProgress?.recordGameAttempt?.({
        question: q,
        correctAnswer: correctDisplay,
        selectedAnswer: answerToString(selected),
        options,
        correctOptionLabel: optionLabelFor(q, correct),
        selectedOptionLabel: optionLabelFor(q, selected),
        isCorrect: isSameAnswer(selected, correct)
      });

      renderSolutionBox();
      nextBtn.disabled = false;
      progressBar.style.width = `${((currentIndex + 1) / quiz.length) * 100}%`;
    }

    function handleTimeUp(){
      if(answered) return;
      clearTimer();
      answered = true;

      const q = quiz[currentIndex];
      const correct = correctAnswer(q);
      const correctDisplay = answerToString(correct);
      const buttons = [...optionsEl.querySelectorAll(".option")];

      buttons.forEach(btn => {
        btn.disabled = true;
        if(btn.dataset.answerKey === answerKey(correct)) btn.classList.add("correct");
      });

      lastFeedback = { correct:false, answer:correctDisplay, timeUp:true };
      renderFeedback(false, correctDisplay, true);
      wrongAnswers.push({
        main: q.plain,
        answer: correctDisplay,
        selected: null,
        options: optionPayload(q, null),
        timeUp: true,
        type: q.type,
        difficulty: q.difficulty
      });

      const options = optionPayload(q, null);
      void window.MCLProgress?.recordGameAttempt?.({
        question: q,
        correctAnswer: correctDisplay,
        selectedAnswer: "",
        options,
        correctOptionLabel: optionLabelFor(q, correct),
        selectedOptionLabel: "",
        isCorrect: false,
        timeUp: true
      });

      renderSolutionBox();
      nextBtn.disabled = false;
      progressBar.style.width = `${((currentIndex + 1) / quiz.length) * 100}%`;
    }

    function nextQuestion(){
      if(!answered) return;
      if(currentIndex < quiz.length - 1){
        currentIndex++;
        renderQuestion(true);
      } else {
        showResult();
      }
    }

    function showResult(){
      clearTimer();
      quizCard.classList.add("hidden");
      resultCard.classList.remove("hidden");
      renderResultBody();
    }

    function wrongChoicesHtml(w){
      if(!w.options || !w.options.length) return "";
      return `
        <div><strong>${tr().choices}:</strong></div>
        <div class="wrong-choices">
          ${w.options.map(option => {
            const badges = [];
            if(option.isSelected) badges.push(tr().yourChoice);
            if(option.isCorrect) badges.push(tr().correctChoice);
            return `
              <div class="wrong-choice ${option.isCorrect ? "correct" : ""} ${option.isSelected ? "selected" : ""}">
                <span><strong>${escapeHtml(option.label)}.</strong> ${mathSpan(option.latex, "wrong-math")}</span>
                ${badges.length ? `<span class="wrong-choice-badge">${escapeHtml(badges.join(" Â· "))}</span>` : ""}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderResultBody(){
      const total = Math.min(quiz.length, currentIndex + (answered ? 1 : 0));
      const accuracy = total === 0 ? 0 : Math.round((correctCount / total) * 100);
      scoreNum.textContent = `${correctCount}/${total}`;
      accuracyNum.textContent = `${accuracy}%`;
      wrongNum.textContent = `${wrongAnswers.length}`;
      wrongList.innerHTML = "";

      if(wrongAnswers.length === 0){
        const item = document.createElement("div");
        item.className = "wrong-item";
        item.innerHTML = `<div class="expr">${tr().noWrong}</div><p class="tag-good">${tr().noWrongTip}</p>`;
        wrongList.appendChild(item);
      } else {
        wrongAnswers.forEach((w,i) => {
          const item = document.createElement("div");
          item.className = "wrong-item";
          item.innerHTML = `
            <div class="expr">${i+1}. ${escapeHtml(w.main)}</div>
            ${wrongChoicesHtml(w)}
            <p>${tr().yourAnswer}: <span class="tag-bad">${escapeHtml(w.timeUp ? tr().timeUpAnswer : w.selected)}</span></p>
            <p>${tr().correctAnswer}: <span class="tag-good">${escapeHtml(w.answer)}</span></p>
            <p>${tr().suggestion}</p>
          `;
          wrongList.appendChild(item);
          renderTaggedMath(item);
        });
      }
    }

    function resetToSetup(){
      clearTimer();
      setupCard.classList.remove("hidden");
      quizCard.classList.add("hidden");
      resultCard.classList.add("hidden");
      progressBar.style.width = "0%";
      sampleBox.classList.add("hidden");
      sampleBox.innerHTML = "";
      solutionBox.classList.add("hidden");
      solutionBox.innerHTML = "";
      lastFeedback = null;
    }

    function quitQuiz(){
      if(answered || currentIndex > 0) showResult();
      else resetToSetup();
    }

    function showSample(){
      const sampleDifficulty = pickDifficultyForSample(difficultyEl.value);
      const q = GAME.generateQuestion(sampleDifficulty);
      const correct = answerToString(correctAnswer(q));
      sampleBox.classList.remove("hidden");
      sampleBox.innerHTML = `
        <strong>${tr().sampleTitle}:</strong><br>
        ${tr().sampleQuestion}: ${mathSpan(q.plain, "sample-math")}<br>
        ${tr().sampleAnswer}: ${mathSpan(correct, "sample-math")}<br>
        ${tr().sampleOptions}: ${q.options.map(x => mathSpan(answerToString(x), "sample-math")).join(" ")}
      `;
      renderTaggedMath(sampleBox);
    }

    timedModeEl.addEventListener("change", updateTimerControls);
    startBtn.addEventListener("click", buildQuiz);
    sampleBtn.addEventListener("click", showSample);
    nextBtn.addEventListener("click", nextQuestion);
    quitBtn.addEventListener("click", quitQuiz);
    restartBtn.addEventListener("click", resetToSetup);
    reviewWrongBtn.addEventListener("click", buildWrongTypeQuiz);

    applyLanguage();

  </script>
