  <script>
    function tag(type, fn){ fn.__type = type; return fn; }
    function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b) [a,b]=[b,a%b]; return a || 1; }
    function reduce(n,d){ const g=gcd(n,d); n/=g; d/=g; if(d<0){ n=-n; d=-d; } return {n,d}; }
    function varPart(v,e){ return e===1 ? v : `${v}^{${e}}`; }
    function part(coef,powers){
      const vars = Object.keys(powers).sort().filter(v => powers[v] > 0).map(v => varPart(v,powers[v]));
      if(coef === 1 && vars.length) return vars.join("");
      return `${coef}${vars.join("")}`;
    }
    function mono(coefNum, coefDen, powers){
      const frac = reduce(coefNum, coefDen);
      const numP = {}, denP = {};
      Object.keys(powers).forEach(v => {
        const e = powers[v];
        if(e > 0) numP[v] = e;
        if(e < 0) denP[v] = -e;
      });
      const num = part(Math.abs(frac.n), numP);
      const den = part(frac.d, denP);
      const sign = frac.n < 0 ? "-" : "";
      const hasDen = frac.d !== 1 || Object.keys(denP).length;
      const latex = hasDen ? `${sign}\\frac{${num || "1"}}{${den || "1"}}` : `${sign}${num}`;
      const key = `${frac.n}/${frac.d}|${Object.keys(powers).sort().map(v => `${v}:${powers[v]}`).join(",")}`;
      return { latex, key };
    }
    const T = {
      en:{
        toolBadge:"Algebra I Â· Algebra II", title:"Exponent Laws Practice",
        subtitle:"Simplify exponent expressions using product, quotient, power, zero, and negative exponent rules.",
        note:"Every answer is written with positive exponents. Distractors are built from common exponent-law mistakes.",
        questionTitle:"Choose the correct simplification.",
        promptSimplify:"Simplify. Write your answer using positive exponents.",
        difficultyOptions:{easy:"Easy: one exponent law at a time",medium:"Medium: coefficients and two variables",hard:"Hard: negative exponents and fractions",expert:"Expert: multi-step mixed laws",mixed:"Mixed: balanced practice from all levels"},
        suggestion:"Suggestion: check whether bases match, distribute powers carefully, and move negative exponents across the fraction bar.",
        notes:{product:"add exponents",quotient:"subtract exponents",power:"multiply exponents",productPower:"distribute the outside power",negative:"rewrite with positive exponents",final:"positive exponents"}
      },
      zh:{
        toolBadge:"Algebra I Â· Algebra II", title:"æŒ‡æ•°è¿ç®—æ³•åˆ™ç»ƒä¹ ",
        subtitle:"ä¸“é¡¹ç»ƒä¹ åŒåº•æ•°ä¹˜é™¤ã€å¹‚çš„å¹‚ã€ç§¯çš„å¹‚ã€é›¶æŒ‡æ•°å’Œè´ŸæŒ‡æ•°åŒ–ç®€ã€‚",
        note:"æ‰€æœ‰ç­”æ¡ˆç»Ÿä¸€å†™æˆæ­£æŒ‡æ•°å½¢å¼ã€‚å¹²æ‰°é¡¹æ¥è‡ªå¸¸è§æŒ‡æ•°æ³•åˆ™é”™è¯¯ã€‚",
        questionTitle:"é€‰æ‹©æ­£ç¡®çš„åŒ–ç®€ç»“æžœã€‚",
        promptSimplify:"åŒ–ç®€ï¼Œå¹¶ç”¨æ­£æŒ‡æ•°å½¢å¼è¡¨ç¤ºç­”æ¡ˆã€‚",
        difficultyOptions:{easy:"ç®€å•ï¼šæ¯é¢˜ä¸€ä¸ªæŒ‡æ•°æ³•åˆ™",medium:"ä¸­ç­‰ï¼šç³»æ•°å’Œä¸¤ä¸ªå˜é‡",hard:"å›°éš¾ï¼šè´ŸæŒ‡æ•°å’Œåˆ†å¼",expert:"ä¸“å®¶ï¼šå¤šæ­¥æ··åˆæŒ‡æ•°æ³•åˆ™",mixed:"æ··åˆï¼šä»Žæ‰€æœ‰éš¾åº¦ä¸­å‡è¡¡å‡ºé¢˜"},
        suggestion:"å»ºè®®ï¼šå…ˆç¡®è®¤åº•æ•°æ˜¯å¦ç›¸åŒï¼Œå¹‚çš„å¹‚è¦ä¹˜æŒ‡æ•°ï¼Œè´ŸæŒ‡æ•°è¦ç§»åˆ°åˆ†å¼å¦ä¸€ä¾§ã€‚",
        notes:{product:"æŒ‡æ•°ç›¸åŠ ",quotient:"æŒ‡æ•°ç›¸å‡",power:"æŒ‡æ•°ç›¸ä¹˜",productPower:"æŠŠå¤–å±‚æŒ‡æ•°åˆ†é…è¿›åŽ»",negative:"æ”¹å†™æˆæ­£æŒ‡æ•°",final:"æ­£æŒ‡æ•°å½¢å¼"}
      }
    };
    function tr(){ return T[localStorage.getItem("mathcomplete_lang")==="zh" ? "zh" : "en"]; }
    function line(main, answer, noteKey){ return [{line:main,note:tr().notes[noteKey]},{line:answer.latex,note:tr().notes.final}]; }
    function make(type, main, answer, distractors, noteKey){ return { type, promptKey:"promptSimplify", main, plain:main, answer, distractors, lines:line(main,answer,noteKey) }; }
    const B = {
      easy:[
        tag("same-base-product", h => { const v=h.choice(["x","a","m"]); const a=h.randInt(2,7), b=h.randInt(2,7), ans=mono(1,1,{[v]:a+b}); return make("same-base-product",`${v}^{${a}}\\cdot ${v}^{${b}}`,ans,[mono(1,1,{[v]:a*b}),mono(1,1,{[v]:Math.abs(a-b)}),mono(1,1,{[v]:a+b+1})],"product"); }),
        tag("same-base-quotient", h => { const v=h.choice(["x","b","n"]); const b=h.randInt(2,6), a=b+h.randInt(2,7), ans=mono(1,1,{[v]:a-b}); return make("same-base-quotient",`\\frac{${v}^{${a}}}{${v}^{${b}}}`,ans,[mono(1,1,{[v]:a+b}),mono(1,1,{[v]:a*b}),mono(1,1,{[v]:b-a})],"quotient"); }),
        tag("power-of-power", h => { const v=h.choice(["x","y","p"]); const a=h.randInt(2,5), b=h.randInt(2,5), ans=mono(1,1,{[v]:a*b}); return make("power-of-power",`\\left(${v}^{${a}}\\right)^{${b}}`,ans,[mono(1,1,{[v]:a+b}),mono(1,1,{[v]:Math.pow(a,b)}),mono(1,1,{[v]:a*b+1})],"power"); }),
        tag("product-power", h => { const n=h.randInt(2,5), ans=mono(1,1,{x:n,y:n}); return make("product-power",`\\left(xy\\right)^{${n}}`,ans,[mono(1,1,{x:n,y:1}),mono(1,1,{x:n+1,y:n}),mono(1,1,{x:n+n})],"productPower"); })
      ],
      medium:[
        tag("coefficient-power", h => { const c=h.choice([2,3,4]), m=h.randInt(2,4), n=h.randInt(2,3), ans=mono(c**n,1,{x:m*n}); return make("coefficient-power",`\\left(${c}x^{${m}}\\right)^{${n}}`,ans,[mono(c,1,{x:m*n}),mono(c**n,1,{x:m+n}),mono(c*n,1,{x:m*n})],"productPower"); }),
        tag("two-variable-product", h => { const a=h.randInt(2,5), b=h.randInt(2,5), c=h.randInt(2,5), d=h.randInt(2,5), ans=mono(1,1,{x:a+c,y:b+d}); return make("two-variable-product",`x^{${a}}y^{${b}}\\cdot x^{${c}}y^{${d}}`,ans,[mono(1,1,{x:a*c,y:b*d}),mono(1,1,{x:a+c,y:Math.abs(b-d)||1}),mono(1,1,{x:a+c})],"product"); }),
        tag("two-variable-quotient", h => { const c=h.randInt(2,3), d=h.randInt(2,3), a=c+h.randInt(2,5), b=d+h.randInt(2,5), ans=mono(1,1,{x:a-c,y:b-d}); return make("two-variable-quotient",`\\frac{x^{${a}}y^{${b}}}{x^{${c}}y^{${d}}}`,ans,[mono(1,1,{x:a+c,y:b+d}),mono(1,1,{x:a-c,y:b+d}),mono(1,1,{x:a+c,y:b-d})],"quotient"); }),
        tag("negative-simple", h => { const n=h.randInt(2,8), ans=mono(1,1,{x:-n}); return make("negative-simple",`x^{-${n}}`,ans,[mono(1,1,{x:n}),mono(-1,1,{x:n}),mono(1,1,{x:-n-1})],"negative"); })
      ],
      hard:[
        tag("power-negative", h => { const a=h.randInt(2,4), b=h.randInt(1,4), n=h.randInt(2,3), ans=mono(1,1,{x:a*n,y:-b*n}); return make("power-negative",`\\left(x^{${a}}y^{-${b}}\\right)^{${n}}`,ans,[mono(1,1,{x:a+n,y:-b+n}),mono(1,1,{x:a*n,y:b*n}),mono(1,1,{x:a*n,y:-b})],"power"); }),
        tag("fraction-power", h => { const c=h.choice([2,3]), a=h.randInt(2,3), b=h.randInt(2,3), n=h.randInt(2,3), ans=mono(c**n,1,{x:a*n,y:-b*n}); return make("fraction-power",`\\left(\\frac{${c}x^{${a}}}{y^{${b}}}\\right)^{${n}}`,ans,[mono(c,1,{x:a*n,y:-b*n}),mono(c**n,1,{x:a+n,y:-b-n}),mono(c*n,1,{x:a*n,y:-b*n})],"productPower"); }),
        tag("quotient-negative", h => { const a=h.randInt(2,4), c=a+h.randInt(2,4), b=h.randInt(2,4), d=h.randInt(2,4), ans=mono(1,1,{x:a-c,y:-b-d}); return make("quotient-negative",`\\frac{x^{${a}}y^{-${b}}}{x^{${c}}y^{${d}}}`,ans,[mono(1,1,{x:a+c,y:-b+d}),mono(1,1,{x:c-a,y:b+d}),mono(1,1,{x:a-c,y:b-d})],"quotient"); }),
        tag("mixed-product", h => { const a=h.randInt(2,4), b=h.randInt(3,5), c=h.randInt(2,3), d=h.randInt(2,b-1), e=h.randInt(2,a+c-1), ans=mono(6,1,{x:a+c-e,y:b-d}); return make("mixed-product",`\\frac{3x^{${a}}y^{${b}}\\cdot 2x^{${c}}y^{-${d}}}{x^{${e}}}`,ans,[mono(5,1,{x:a+c-e,y:b-d}),mono(6,1,{x:a+c+e,y:b-d}),mono(6,1,{x:a+c-e,y:b+d})],"final"); })
      ],
      expert:[
        tag("expert-quotient-power", h => { const a=h.randInt(2,3), b=h.randInt(2,3), n=2, c=h.randInt(2,3), d=h.randInt(2,3), ans=mono(1,1,{x:-a*n-c,y:b*n+d}); return make("expert-quotient-power",`\\frac{\\left(2x^{-${a}}y^{${b}}\\right)^2}{4x^{${c}}y^{-${d}}}`,ans,[mono(1,1,{x:a*n-c,y:b*n+d}),mono(1,1,{x:-a*n-c,y:b*n-d}),mono(1,1,{x:-a*n+c,y:b*n+d})],"final"); }),
        tag("expert-symbolic", h => { const m=h.randInt(2,4), n=h.randInt(2,3), p=h.randInt(2,3), q=h.randInt(2,4), r=h.randInt(2,4), ans=mono(1,1,{a:m*p+q,b:-n*p-r}); return make("expert-symbolic",`\\frac{\\left(a^{${m}}b^{-${n}}\\right)^{${p}}}{a^{-${q}}b^{${r}}}`,ans,[mono(1,1,{a:m+p+q,b:-n*p-r}),mono(1,1,{a:m*p-q,b:-n*p+r}),mono(1,1,{a:m*p+q,b:n*p-r})],"final"); }),
        tag("expert-fraction", h => { const a=h.randInt(2,3), b=h.randInt(2,3), c=h.randInt(2,3), ans=mono(9,4,{x:-2*a-c,y:2*b}); return make("expert-fraction",`\\left(\\frac{3y^{${b}}}{2x^{${a}}}\\right)^2\\cdot x^{-${c}}`,ans,[mono(3,2,{x:-2*a-c,y:2*b}),mono(9,4,{x:2*a-c,y:2*b}),mono(9,4,{x:-2*a+c,y:b+2})],"final"); }),
        tag("expert-zero-negative", h => { const a=h.randInt(2,5), b=h.randInt(2,4), ans=mono(1,1,{x:a,y:-b}); return make("expert-zero-negative",`\\frac{x^{${a}}y^0}{y^{${b}}}`,ans,[mono(1,1,{x:a,y:b}),mono(1,1,{x:a+b}),mono(1,1,{x:a,y:0})],"negative"); })
      ]
