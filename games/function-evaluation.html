    function valLinear(a,b,x){return a*x+b;}
    function valQuad(a,b,c,x){return a*x*x+b*x+c;}
    function fnum(n){return n<0?`(${n})`:String(n);}
    function multDisplay(coef, input){
      return `${coef}(${input})`;
    }
    function signedLinearTerm(coef, input){
      if(coef===0) return "";
      return coef>0 ? ` + ${coef}(${input})` : ` - ${Math.abs(coef)}(${input})`;
    }
    function signedConstant(c){
      if(c===0) return "";
      return c>0 ? ` + ${c}` : ` - ${Math.abs(c)}`;
    }
    function termA(a){if(a===1)return "x";if(a===-1)return "-x";return `${a}x`;}
    function formatLinearFn(a,b){return `${termA(a)}${b>0?" + "+b:b<0?" - "+Math.abs(b):""}`;}
    function formatLinearA(coef, constant){
      let result = "";
      if(coef === 1) result = "a";
      else if(coef === -1) result = "-a";
      else result = `${coef}a`;

      if(constant > 0) result += ` + ${constant}`;
      if(constant < 0) result += ` - ${Math.abs(constant)}`;

      return result;
    }
    function formatAQuadratic(a,b,c){
      const terms = [];
      if(a) terms.push(a===1 ? "a^2" : a===-1 ? "-a^2" : `${a}a^2`);
      if(b) terms.push(b>0 ? (b===1 ? "a" : `${b}a`) : (b===-1 ? "-a" : `${b}a`));
      if(c) terms.push(String(c));
      if(!terms.length) return "0";
      return terms.map((term,index)=>{
        if(index===0) return term;
        return term.startsWith("-") ? ` - ${term.slice(1)}` : ` + ${term}`;
      }).join("");
    }
    function formatQuad(a,b,c){let s=a===1?"xÂ²":a===-1?"-xÂ²":`${a}xÂ²`; if(b) s+= b>0?` + ${Math.abs(b)}x`:` - ${Math.abs(b)}x`; if(c) s+= c>0?` + ${c}`:` - ${Math.abs(c)}`; return s;}
    function ans(v){return {kind:"value",value:String(v),num:v};}
    const GAME={
      answerToString(a){return String(a.value);},
      generateQuestion(difficulty, forcedType=null){
        let q;
        if(difficulty==="easy"||difficulty==="medium"){
          const a=choose([-5,-4,-3,-2,2,3,4,5]),b=randInt(-9,9),x=difficulty==="easy"?randInt(1,8):randInt(-8,8);
          const fx=formatLinearFn(a,b),y=valLinear(a,b,x);
          q={difficulty,type:"linear",main:`f(x) = ${fx}`,extra:`f(${x}) = ?`,plain:`f(x) = ${fx}, find f(${x})`,answer:ans(y),data:{fx,a,b,x,y}};

          q={difficulty,type:"quadratic",main:`f(x) = ${fx}`,extra:`f(${x}) = ?`,plain:`f(x) = ${fx}, find f(${x})`,answer:ans(y),data:{fx,a,b,c,x,y}};

      options(q,count){
        const correct = q.answer;
        const distractors = new Map();

        const addDistractor = a => {
          if (answerKey(a) !== answerKey(correct)) {
            distractors.set(answerKey(a), a);
          }
        };
        (q.distractors || []).forEach(addDistractor);

        if (q.answer.num !== null) {
          const y = q.answer.num;
          [
            y + 1,
            y - 1,
            -y,
            y + 2,
            y - 2,
            y + 5,
            y - 5,
            y + 10,
            y - 10
          ].forEach(n => addDistractor(ans(n)));

          while (distractors.size < count - 1) {
            addDistractor(ans(randInt(-30, 30)));
          }
        } else {
          const s = q.answer.value;
          [
            "a",
            "2a",
            "a + 1",
            "-a",
            s.replace(" + ", " - "),
            s.replace(" - ", " + ")
          ].forEach(v => addDistractor({kind:"value", value:v, num:null}));

          while (distractors.size < count - 1) {
            const coef = choose([-5,-4,-3,-2,2,3,4,5]);
            const constant = randInt(-10,10);
            const expr = formatLinearA(coef, constant);
            addDistractor({kind:"value", value:expr, num:null});
          }
        }

        return shuffle([
          correct,
          ...shuffle([...distractors.values()]).slice(0, count - 1)
        ]);
      },

            {line:`f(x) = ${d.fx}`,note:t.given},
            {line:`f(${d.expr}) = ${d.a}(${d.expr})${signedConstant(d.b)}`,note:t.substitute},
            {line:`f(${d.expr}) = ${d.simplified}`,note:t.simplify}
          ];

            {line:`f(x) = ${d.fx}`,note:t.given},
            {line:`f(${d.expr}) = ${d.A}(${d.expr})^2${signedLinearTerm(d.B,d.expr)}${signedConstant(d.C)}`,note:t.substitute},
            {line:`f(${d.expr}) = ${d.simplified}`,note:t.simplify}
          ];
        }

        return [
          {line:`g(${d.x}) = ${multDisplay(d.c,d.x)}${signedConstant(d.d)}`,note:t.compose},
          {line:`g(${d.x}) = ${d.gx}`,note:t.simplify},
          {line:`f(g(${d.x})) = f(${d.gx})`,note:t.substitute},
          {line:`f(${d.gx}) = ${multDisplay(d.a,d.gx)}${signedConstant(d.b)}`,note:t.substitute},
          {line:`f(${d.gx}) = ${d.y}`,note:t.simplify}
        ];
      }
    };

    function buildDifficultyPlan(count, selectedDifficulty) {
      if (selectedDifficulty !== "mixed") {
        return Array(count).fill(selectedDifficulty);
      }

      const plan = [];
      while (plan.length < count) {

    function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
    function choose(arr){return arr[randInt(0,arr.length-1)];}

    function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
    function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
    function escapeHtml(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
    function splitTopLevel(input, delimiter){
      const parts = [];
      let depth = 0;
      let start = 0;
      for(let i = 0; i < input.length; i++){
        const ch = input[i];
        if(ch === "(") depth++;
        else if(ch === ")") depth = Math.max(0, depth - 1);
        else if(ch === delimiter && depth === 0){
          parts.push(input.slice(start, i).trim());
          start = i + 1;
        }
      }
      parts.push(input.slice(start).trim());
      return parts.filter(Boolean);
    }

    function findTopLevel(input, target){
      let depth = 0;
      for(let i = 0; i < input.length; i++){
        const ch = input[i];
        if(ch === "(") depth++;
        else if(ch === ")") depth = Math.max(0, depth - 1);
        else if(ch === target && depth === 0) return i;
      }
      return -1;
    }

    function stripOuterParens(input){
      const s = String(input).trim();
      if(!s.startsWith("(") || !s.endsWith(")")) return s;
      let depth = 0;
      for(let i = 0; i < s.length; i++){
        if(s[i] === "(") depth++;
        if(s[i] === ")") depth--;
        if(depth === 0 && i < s.length - 1) return s;
      }
      return s.slice(1, -1).trim();
    }

    function escapeLatexText(text){
      return String(text)
        .replace(/\\/g, "\\textbackslash{}")
        .replace(/([#$%&_{}])/g, "\\$1");
    }

    function mathToLatex(expr){
      let s = String(expr ?? "").trim();
      if(!s) return "";

      s = s
        .replace(/âˆ’/g, "-")
        .replace(/Ã—/g, "\\times ")
        .replace(/Â·/g, "\\cdot ")
        .replace(/\u00a0/g, " ");

      const pureText = {
        "No solution": "\\text{No solution}",
        "Infinitely many solutions": "\\text{Infinitely many solutions}",
        "No answer: time is up": "\\text{No answer: time is up}",
        "æ— è§£": "\\text{æ— è§£}",
        "æ— ç©·å¤šä¸ªè§£": "\\text{æ— ç©·å¤šä¸ªè§£}",
        "æœªä½œç­”ï¼ˆæ—¶é—´åˆ°ï¼‰": "\\text{æœªä½œç­”ï¼ˆæ—¶é—´åˆ°ï¼‰}"
      };
      if(pureText[s]) return pureText[s];

      const colonMatch = s.match(/^([A-Za-z\u4e00-\u9fff ]+):\s*(.+)$/);
      if(colonMatch){
        return `\\text{${escapeLatexText(colonMatch[1] + ": ")}}${mathToLatex(colonMatch[2])}`;
      }

      const commaParts = splitTopLevel(s, ",");
      if(commaParts.length > 1){
        return commaParts.map(part => mathToLatex(part)).join(",\\quad ");
      }

      const equalParts = splitTopLevel(s, "=");
      if(equalParts.length > 1){
        return equalParts.map(part => mathToLatex(part)).join(" = ");
      }

      const slashIndex = findTopLevel(s, "/");
      if(slashIndex > -1){
        const numerator = stripOuterParens(s.slice(0, slashIndex));
        const denominator = stripOuterParens(s.slice(slashIndex + 1));
        return `\\frac{${mathToLatex(numerator)}}{${mathToLatex(denominator)}}`;
      }

      s = s.replace(/\*/g, "\\cdot ");
      s = s.replace(/\bof\b/g, "\\text{ of }");
      s = s.replace(/%/g, "\\%");
      s = s.replace(/Ï€/g, "\\text{Ï€}");
      s = s.replace(/\?/g, "?");

      s = s.replace(/sqrt\(([^()]*)\)/g, (_, inner) => `\\sqrt{${mathToLatex(inner)}}`);
      s = s.replace(/sec\^2\(([^()]*)\)/g, (_, inner) => `\\sec^{2}\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/(sin|cos|tan|sec|ln)\(([^()]*)\)/g, (_, fn, inner) => `\\${fn}\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/f\(g\(([^()]*)\)\)/g, (_, inner) => `f\\left(g\\left(${mathToLatex(inner)}\\right)\\right)`);
      s = s.replace(/g\(f\(([^()]*)\)\)/g, (_, inner) => `g\\left(f\\left(${mathToLatex(inner)}\\right)\\right)`);
      s = s.replace(/f\(([^()]*)\)/g, (_, inner) => `f\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/g\(([^()]*)\)/g, (_, inner) => `g\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/e\^\(([^()]*)\)/g, (_, inner) => `e^{${mathToLatex(inner)}}`);
      s = s.replace(/e\^x/g, "e^{x}");

      s = s.replace(/\^\(([^)]+)\)/g, (_, exponent) => `^{${mathToLatex(exponent)}}`);
      s = s.replace(/\^(-?\d+)/g, "^{$1}");
      s = s.replace(/\^([a-zA-Z]+)/g, "^{$1}");
      s = s.replace(/([a-zA-Z])Â²/g, "$1^{2}");
      s = s.replace(/([a-zA-Z])Â³/g, "$1^{3}");

      s = s.replace(/x\^\{1\}/g, "x");
      s = s.replace(/x\^\{0\}/g, "1");
      s = s.replace(/\bln\b/g, "\\ln");
      s = s.replace(/(^|[^A-Za-z])pi(?![A-Za-z])/g, "$1\\text{Ï€}");

      return s;
    }

    function shouldRenderMath(expr){
      const s = String(expr ?? "").trim();
      if(!s) return false;
      if(["No solution","Infinitely many solutions","æ— è§£","æ— ç©·å¤šä¸ªè§£"].includes(s)) return true;
      if(/[=^/*+\-()Ï€%Â²Â³]/.test(s)) return true;
      if(/^\s*-?\d+(\.\d+)?\s*$/.test(s)) return true;
      if(isSimpleMonomial(s)) return true;
      if(/^[A-Za-z]\s*\(/.test(s)) return true;
      return false;
    }

    function isSimpleMonomial(expr){
      const compact = String(expr ?? "").replace(/\s+/g, "");
      if(!/^-?(?:\d+(?:\.\d+)?)?[A-Za-z]{1,4}$/.test(compact)) return false;
      const letters = compact.replace(/^-?(?:\d+(?:\.\d+)?)?/, "");
      if(!letters) return false;
      if(/^(sin|cos|tan|sec|log|ln|area|base|rate|time|easy|hard)$/i.test(letters)) return false;
      return /\d/.test(compact) || /^[xyzabcmnptuv]/i.test(letters) || letters.length <= 2;
    }

    function renderLatex(el, latex, displayMode=false){
      el.classList.add("math-render");
      const boldLatex = `\\boldsymbol{${latex}}`;
      if(window.katex){
        katex.render(boldLatex, el, {
          throwOnError: false,
          displayMode
        });
      } else {
        el.textContent = latex;
      }
    }

    function renderMath(el, expr, displayMode=false){
      renderLatex(el, mathToLatex(expr), displayMode);
    }

    function renderMaybeMath(el, expr, displayMode=false){
      const raw = String(expr ?? "");
      if(shouldRenderMath(raw)){
        renderMath(el, raw, displayMode);
      } else {
        el.classList.remove("math-render");
        el.textContent = raw;
      }
    }
