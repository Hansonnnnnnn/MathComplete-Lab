    function ans(v){return {kind:"value",value:String(v)};}
    function piTerm(n){if(n===1)return "π";return `${n}π`;}
    function geometryPrompt(target, shape){
      const en = {
        area: "Find the area of the",
        perimeter: "Find the perimeter of the",
        circumference: "Find the circumference of the",
        volume: "Find the volume of the",
        halfArea: "Find half of the area of the",
        areaCoefficient: "Find the coefficient of pi in the area of the"
      };
      const zh = {
        area: "求这个图形的面积：",
        perimeter: "求这个图形的周长：",
        circumference: "求这个圆的圆周长：",
        volume: "求这个立体图形的体积：",
        halfArea: "求这个图形面积的一半：",
        areaCoefficient: "求这个圆面积中 pi 前面的系数："
      };
      if(lang === "zh") return zh[target] || "求指定的量：";
      return `${en[target] || "Find the requested value of the"} ${shape}.`;
    }
    function geometryGiven(shape, values){
      return `${shape}: ${values}`;
    }
    const GAME={
      answerToString(a){return a.value;},
      generateQuestion(difficulty, forcedType=null){
        const registry = window.MCLQuestionTemplates;
        if (registry?.getTool?.("geometry-formula")) {
          const available = registry.templatesFor("geometry-formula", difficulty, forcedType);
          if (available.length) {
            const template = choose(available);
            const raw = registry.build("geometry-formula", template.id, {
              seed: `geometry-formula:${Date.now()}:${Math.random()}`,
              lang
            });
            const q = {
              ...raw,
              difficulty: template.difficulty,
              type: raw.familyId,
              extra: raw.prompt,
              answer: ans(raw.answer),
              data: raw.parameters || {},
              lines: raw.lines || []
            };
            const count = Number(optionCountEl.value || 4);
            const choices = [q.answer, ...(raw.distractors || []).map(ans)];
            const unique = [...new Map(choices.map(item => [answerKey(item), item])).values()];
            q.options = shuffle(unique.slice(0, count));
            return q;
          }
        }
        let type;if(difficulty==="easy")type=choose(["rect_area","rect_perim","tri_area"]);else if(difficulty==="medium")type=choose(["circle_area","circle_circ"]);else if(difficulty==="hard")type=choose(["box_volume","cube_volume","cylinder_volume"]);else if(difficulty==="expert")type=choose(["circle_area_diameter","circle_circ_diameter","mixed_rect"]);else type=choose(["missing_rect_perim","discount_area","circle_combo","cylinder_volume"]);
        if(forcedType)type=forcedType;let q;
        if(type==="rect_area"){const l=randInt(3,15),w=randInt(2,12);q={difficulty,type,main:geometryPrompt("area","rectangle"),extra:geometryGiven("Rectangle",`l = ${l}, w = ${w}`),plain:`Find the area of the rectangle. Rectangle l=${l}, w=${w}`,answer:ans(l*w),data:{l,w}};}
        else if(type==="rect_perim"){const l=randInt(3,15),w=randInt(2,12);q={difficulty,type,main:geometryPrompt("perimeter","rectangle"),extra:geometryGiven("Rectangle",`l = ${l}, w = ${w}`),plain:`Find the perimeter of the rectangle. Rectangle l=${l}, w=${w}`,answer:ans(2*(l+w)),data:{l,w}};}
        else if(type==="tri_area"){const b=randInt(4,18),h=randInt(3,12);q={difficulty,type,main:geometryPrompt("area","triangle"),extra:geometryGiven("Triangle",`b = ${b}, h = ${h}`),plain:`Find the area of the triangle. Triangle b=${b}, h=${h}`,answer:ans(b*h/2),data:{b,h}};}
        else if(type==="circle_area"){const r=randInt(2,10);q={difficulty,type,main:geometryPrompt("area","circle"),extra:geometryGiven("Circle",`r = ${r}`),plain:`Find the area of the circle. Circle r=${r}`,answer:ans(piTerm(r*r)),data:{r}};}
        else if(type==="circle_circ"){const r=randInt(2,10);q={difficulty,type,main:geometryPrompt("circumference","circle"),extra:geometryGiven("Circle",`r = ${r}`),plain:`Find the circumference of the circle. Circle r=${r}`,answer:ans(piTerm(2*r)),data:{r}};}
        else if(type==="box_volume"){const l=randInt(2,10),w=randInt(2,8),h=randInt(2,8);q={difficulty,type,main:geometryPrompt("volume","rectangular prism"),extra:geometryGiven("Rectangular prism",`l = ${l}, w = ${w}, h = ${h}`),plain:`Find the volume of the rectangular prism. Rectangular prism l=${l}, w=${w}, h=${h}`,answer:ans(l*w*h),data:{l,w,h}};}
        else if(type==="cube_volume"){const s=randInt(2,9);q={difficulty,type,main:geometryPrompt("volume","cube"),extra:geometryGiven("Cube",`side = ${s}`),plain:`Find the volume of the cube. Cube side=${s}`,answer:ans(s*s*s),data:{s}};}
        else if(type==="cylinder_volume"){const r=randInt(2,7),h=randInt(2,9);q={difficulty,type,main:geometryPrompt("volume","cylinder"),extra:geometryGiven("Cylinder",`r = ${r}, h = ${h}`),plain:`Find the volume of the cylinder. Cylinder r=${r}, h=${h}`,answer:ans(piTerm(r*r*h)),data:{r,h}};}
        else if(type==="circle_area_diameter"){const d=choose([4,6,8,10,12,14]);const r=d/2;q={difficulty,type,main:geometryPrompt("area","circle"),extra:geometryGiven("Circle",`d = ${d}`),plain:`Find the area of the circle. Circle diameter=${d}`,answer:ans(piTerm(r*r)),data:{d,r}};}
        else if(type==="circle_circ_diameter"){const d=choose([4,6,8,10,12,14]);q={difficulty,type,main:geometryPrompt("circumference","circle"),extra:geometryGiven("Circle",`d = ${d}`),plain:`Find the circumference of the circle. Circle diameter=${d}`,answer:ans(piTerm(d)),data:{d}};}
        else if(type==="mixed_rect"){const area=choose([24,36,48,60,72]),w=choose([3,4,6]);const l=area/w;q={difficulty,type,main:geometryPrompt("perimeter","rectangle"),extra:geometryGiven("Rectangle",`area = ${area}, w = ${w}`),plain:`Find the perimeter of the rectangle. Rectangle area=${area}, w=${w}`,answer:ans(2*(l+w)),data:{area,w,l}};}
        else if(type==="missing_rect_perim"){const area=choose([48,60,72,96]),w=choose([4,6,8]);const l=area/w;q={difficulty,type,main:geometryPrompt("perimeter","rectangle"),extra:geometryGiven("Rectangle",`area = ${area}, w = ${w}`),plain:`Find the perimeter of the rectangle. Rectangle area=${area}, w=${w}`,answer:ans(2*(l+w)),data:{area,w,l}};}
        else if(type==="discount_area"){const l=randInt(8,16),w=randInt(3,9);q={difficulty,type,main:geometryPrompt("halfArea","rectangle"),extra:geometryGiven("Rectangle",`l = ${l}, w = ${w}`),plain:`Find half of the area of the rectangle. Rectangle l=${l}, w=${w}`,answer:ans(l*w/2),data:{l,w}};}
        else {const r=randInt(2,8);q={difficulty,type:"circle_combo",main:geometryPrompt("areaCoefficient","circle"),extra:geometryGiven("Circle",`r = ${r}`),plain:`Find the coefficient of pi in the area of the circle. Circle r=${r}`,answer:ans(String(r*r)+"π"),data:{r}};}
        q.options=this.options(q,Number(optionCountEl.value||4));return q;
      },
      options(q,count){
        const correct = q.answer;
        const distractors = new Map();

        const addDistractor = v => {
          const item = ans(v);
          if (answerKey(item) !== answerKey(correct)) {
            distractors.set(answerKey(item), item);
          }
        };

        const raw = parseFloat(q.answer.value);

        if(q.answer.value.includes("π")){
          [
            piTerm(raw + 2),
            piTerm(Math.max(1, raw - 2)),
            piTerm(raw * 2),
            String(raw),
            piTerm(raw + 4),
            piTerm(Math.max(1, raw - 4))
          ].forEach(addDistractor);
        } else {
          [
            raw + 1,
            raw - 1,
            raw * 2,
            Math.max(1, raw / 2),
            raw + 10,
            raw - 10,
            raw + 5,
            raw - 5
          ].forEach(v => addDistractor(String(v)));
        }

        while(distractors.size < count - 1){
          addDistractor(String(randInt(4,180)));
        }

        return shuffle([
          correct,
          ...shuffle([...distractors.values()]).slice(0, count - 1)
        ]);
      },
      solutionLines(q){const t=tr().notes,d=q.data;switch(q.type){case"rect_area":return[{line:"A = lw",note:t.formula},{line:`A = ${d.l}(${d.w})`,note:t.substitute},{line:`A = ${q.answer.value}`,note:t.simplify}];case"rect_perim":return[{line:"P = 2(l + w)",note:t.formula},{line:`P = 2(${d.l} + ${d.w})`,note:t.substitute},{line:`P = ${q.answer.value}`,note:t.simplify}];case"tri_area":return[{line:"A = 1/2 bh",note:t.formula},{line:`A = 1/2(${d.b})(${d.h})`,note:t.substitute},{line:`A = ${q.answer.value}`,note:t.simplify}];case"circle_area":return[{line:"A = πr²",note:t.formula},{line:`A = π(${d.r})²`,note:t.substitute},{line:`A = ${q.answer.value}`,note:t.simplify}];case"circle_circ":return[{line:"C = 2πr",note:t.formula},{line:`C = 2π(${d.r})`,note:t.substitute},{line:`C = ${q.answer.value}`,note:t.simplify}];case"circle_area_diameter":return[{line:`r = ${d.d}/2 = ${d.r}`,note:t.radius},{line:"A = πr²",note:t.formula},{line:`A = π(${d.r})²`,note:t.substitute},{line:`A = ${q.answer.value}`,note:t.simplify}];case"circle_circ_diameter":return[{line:"C = πd",note:t.formula},{line:`C = π(${d.d})`,note:t.substitute},{line:`C = ${q.answer.value}`,note:t.simplify}];case"box_volume":return[{line:"V = lwh",note:t.formula},{line:`V = ${d.l}(${d.w})(${d.h})`,note:t.substitute},{line:`V = ${q.answer.value}`,note:t.simplify}];case"cube_volume":return[{line:"V = s³",note:t.formula},{line:`V = ${d.s}³`,note:t.substitute},{line:`V = ${q.answer.value}`,note:t.simplify}];case"cylinder_volume":return[{line:"V = πr²h",note:t.formula},{line:`V = π(${d.r})²(${d.h})`,note:t.substitute},{line:`V = ${q.answer.value}`,note:t.simplify}];case"mixed_rect":case"missing_rect_perim":return[{line:`l = ${d.area}/${d.w} = ${d.l}`,note:t.missing},{line:"P = 2(l + w)",note:t.formula},{line:`P = 2(${d.l} + ${d.w})`,note:t.substitute},{line:`P = ${q.answer.value}`,note:t.simplify}];case"discount_area":return[{line:"A = lw",note:t.formula},{line:`A = ${d.l}(${d.w}) = ${d.l*d.w}`,note:t.substitute},{line:`half = ${d.l*d.w}/2 = ${q.answer.value}`,note:t.simplify}];default:return[{line:"A = πr²",note:t.formula},{line:`A = π(${d.r})²`,note:t.substitute},{line:`A = ${q.answer.value}`,note:t.simplify}];}}
    };

    const legacyGeometrySolutionLines = GAME.solutionLines.bind(GAME);
    GAME.solutionLines = q => q.lines?.length ? q.lines : legacyGeometrySolutionLines(q);

    function readGlobalLanguage(){return localStorage.getItem("mathcomplete_lang")==="zh"?"zh":"en";}
    let lang=readGlobalLanguage();
    const setupCard=document.getElementById("setupCard"),quizCard=document.getElementById("quizCard"),resultCard=document.getElementById("resultCard");
    const difficultyEl=document.getElementById("difficulty"),questionCountEl=document.getElementById("questionCount"),optionCountEl=document.getElementById("optionCount"),timedModeEl=document.getElementById("timedMode"),timerLevelEl=document.getElementById("timerLevel");
    const startBtn=document.getElementById("startBtn"),sampleBtn=document.getElementById("sampleBtn"),sampleBox=document.getElementById("sampleBox"),progressText=document.getElementById("progressText"),difficultyText=document.getElementById("difficultyText"),timerDisplay=document.getElementById("timerDisplay"),progressBar=document.getElementById("progressBar");
    const qTitle=document.getElementById("questionTitle"),qMain=document.getElementById("questionMain"),qExtra=document.getElementById("questionExtra"),optionsEl=document.getElementById("options"),feedbackEl=document.getElementById("feedback"),solutionBox=document.getElementById("solutionBox"),nextBtn=document.getElementById("nextBtn"),quitBtn=document.getElementById("quitBtn");
    const scoreNum=document.getElementById("scoreNum"),accuracyNum=document.getElementById("accuracyNum"),wrongNum=document.getElementById("wrongNum"),wrongList=document.getElementById("wrongList"),restartBtn=document.getElementById("restartBtn"),reviewWrongBtn=document.getElementById("reviewWrongBtn");
    let quiz=[],currentIndex=0,correctCount=0,wrongAnswers=[],answered=false,lastDifficulty="medium",lastFeedback=null,timerId=null,timeLeft=0;
    const TIMER_DURATIONS={timer_easy:120,timer_medium:60,timer_hard:30,timer_expert:15,timer_hell:10};

    const REAL_DIFFICULTIES = ['easy', 'medium', 'hard', 'expert', 'hell'];

    function buildDifficultyPlan(count, selectedDifficulty) {
      if (selectedDifficulty !== "mixed") {
        return Array(count).fill(selectedDifficulty);
      }

      const plan = [];
      while (plan.length < count) {
        plan.push(...shuffle(REAL_DIFFICULTIES));
      }

      return plan.slice(0, count);
    }

    function pickDifficultyForSample(selectedDifficulty) {
      return selectedDifficulty === "mixed" ? choose(REAL_DIFFICULTIES) : selectedDifficulty;
    }
    function tr(){return T[lang];}
    function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
    function choose(arr){return arr[randInt(0,arr.length-1)];}
    function shuffle(arr){const copy=[...arr];for(let i=copy.length-1;i>0;i--){const j=randInt(0,i);[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;}
    function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
    function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
    function escapeHtml(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
    function splitTopLevel(input, delimiter){
      const parts = [];
      let depth = 0;
      let start = 0;
      for(let i = 0; i < input.length; i++){
        const ch = input[i];
        if(ch === "(") depth++;
        else if(ch === ")") depth = Math.max(0, depth - 1);
        else if(ch === delimiter && depth === 0){
          parts.push(input.slice(start, i).trim());
          start = i + 1;
        }
      }
      parts.push(input.slice(start).trim());
      return parts.filter(Boolean);
    }

    function findTopLevel(input, target){
      let depth = 0;
      for(let i = 0; i < input.length; i++){
        const ch = input[i];
        if(ch === "(") depth++;
        else if(ch === ")") depth = Math.max(0, depth - 1);
        else if(ch === target && depth === 0) return i;
      }
      return -1;
    }

    function stripOuterParens(input){
      const s = String(input).trim();
      if(!s.startsWith("(") || !s.endsWith(")")) return s;
      let depth = 0;
      for(let i = 0; i < s.length; i++){
        if(s[i] === "(") depth++;
        if(s[i] === ")") depth--;
        if(depth === 0 && i < s.length - 1) return s;
      }
      return s.slice(1, -1).trim();
    }

    function escapeLatexText(text){
      return String(text)
        .replace(/\\/g, "\\textbackslash{}")
        .replace(/([#$%&_{}])/g, "\\$1");
    }

    function mathToLatex(expr){
      let s = String(expr ?? "").trim();
      if(!s) return "";

      s = s
        .replace(/−/g, "-")
        .replace(/×/g, "\\times ")
        .replace(/·/g, "\\cdot ")
        .replace(/\u00a0/g, " ");

      const pureText = {
        "No solution": "\\text{No solution}",
        "Infinitely many solutions": "\\text{Infinitely many solutions}",
        "No answer: time is up": "\\text{No answer: time is up}",
        "无解": "\\text{无解}",
        "无穷多个解": "\\text{无穷多个解}",
        "未作答（时间到）": "\\text{未作答（时间到）}"
      };
      if(pureText[s]) return pureText[s];

      const colonMatch = s.match(/^([A-Za-z\u4e00-\u9fff ]+):\s*(.+)$/);
      if(colonMatch){
        return `\\text{${escapeLatexText(colonMatch[1] + ": ")}}${mathToLatex(colonMatch[2])}`;
      }

      const commaParts = splitTopLevel(s, ",");
      if(commaParts.length > 1){
        return commaParts.map(part => mathToLatex(part)).join(",\\quad ");
      }

      const equalParts = splitTopLevel(s, "=");
      if(equalParts.length > 1){
        return equalParts.map(part => mathToLatex(part)).join(" = ");
      }

      const slashIndex = findTopLevel(s, "/");
      if(slashIndex > -1){
        const numerator = stripOuterParens(s.slice(0, slashIndex));
        const denominator = stripOuterParens(s.slice(slashIndex + 1));
        return `\\frac{${mathToLatex(numerator)}}{${mathToLatex(denominator)}}`;
      }

      s = s.replace(/\*/g, "\\cdot ");
      s = s.replace(/\bof\b/g, "\\text{ of }");
      s = s.replace(/%/g, "\\%");
      s = s.replace(/π/g, "\\text{π}");
      s = s.replace(/\?/g, "?");

      s = s.replace(/sqrt\(([^()]*)\)/g, (_, inner) => `\\sqrt{${mathToLatex(inner)}}`);
      s = s.replace(/sec\^2\(([^()]*)\)/g, (_, inner) => `\\sec^{2}\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/(sin|cos|tan|sec|ln)\(([^()]*)\)/g, (_, fn, inner) => `\\${fn}\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/f\(g\(([^()]*)\)\)/g, (_, inner) => `f\\left(g\\left(${mathToLatex(inner)}\\right)\\right)`);
      s = s.replace(/g\(f\(([^()]*)\)\)/g, (_, inner) => `g\\left(f\\left(${mathToLatex(inner)}\\right)\\right)`);
      s = s.replace(/f\(([^()]*)\)/g, (_, inner) => `f\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/g\(([^()]*)\)/g, (_, inner) => `g\\left(${mathToLatex(inner)}\\right)`);
      s = s.replace(/e\^\(([^()]*)\)/g, (_, inner) => `e^{${mathToLatex(inner)}}`);
      s = s.replace(/e\^x/g, "e^{x}");

      s = s.replace(/\^\(([^)]+)\)/g, (_, exponent) => `^{${mathToLatex(exponent)}}`);
      s = s.replace(/\^(-?\d+)/g, "^{$1}");
      s = s.replace(/\^([a-zA-Z]+)/g, "^{$1}");
      s = s.replace(/([a-zA-Z])²/g, "$1^{2}");
      s = s.replace(/([a-zA-Z])³/g, "$1^{3}");

      s = s.replace(/x\^\{1\}/g, "x");
      s = s.replace(/x\^\{0\}/g, "1");
      s = s.replace(/\bln\b/g, "\\ln");
      s = s.replace(/(^|[^A-Za-z])pi(?![A-Za-z])/g, "$1\\text{π}");

      return s;
    }

    function shouldRenderMath(expr){
      const s = String(expr ?? "").trim();
      if(!s) return false;
      if(["No solution","Infinitely many solutions","无解","无穷多个解"].includes(s)) return true;
      if(/[=^/*+\-()π%²³]/.test(s)) return true;
      if(/^\s*-?\d+(\.\d+)?\s*$/.test(s)) return true;
      if(isSimpleMonomial(s)) return true;
      if(/^[A-Za-z]\s*\(/.test(s)) return true;
      return false;
    }

    function isSimpleMonomial(expr){
      const compact = String(expr ?? "").replace(/\s+/g, "");
      if(!/^-?(?:\d+(?:\.\d+)?)?[A-Za-z]{1,4}$/.test(compact)) return false;
      const letters = compact.replace(/^-?(?:\d+(?:\.\d+)?)?/, "");
      if(!letters) return false;
      if(/^(sin|cos|tan|sec|log|ln|area|base|rate|time|easy|hard)$/i.test(letters)) return false;
      return /\d/.test(compact) || /^[xyzabcmnptuv]/i.test(letters) || letters.length <= 2;
    }

    function renderLatex(el, latex, displayMode=false){
      el.classList.add("math-render");
      const boldLatex = `\\boldsymbol{${latex}}`;
      if(window.katex){
        katex.render(boldLatex, el, {
          throwOnError: false,
          displayMode
        });
      } else {
        el.textContent = latex;
      }
    }

    function renderMath(el, expr, displayMode=false){
      renderLatex(el, mathToLatex(expr), displayMode);
    }

    function renderMaybeMath(el, expr, displayMode=false){
      const raw = String(expr ?? "");
      if(shouldRenderMath(raw)){
        renderMath(el, raw, displayMode);
      } else {
        el.classList.remove("math-render");
        el.textContent = raw;
      }
    }

    function mathSpan(expr, className=""){
      const cls = className ? ` class="${className}"` : "";
      return `<span${cls} data-math="${escapeHtml(expr)}"></span>`;
    }

    function renderTaggedMath(root){
      root.querySelectorAll("[data-math]").forEach(el => {
        renderMaybeMath(el, el.getAttribute("data-math") || "");
      });
    }


    function formatTime(totalSeconds){const s=Math.max(0,totalSeconds),m=Math.floor(s/60),r=s%60;return `${m}:${String(r).padStart(2,"0")}`;}
    function clearTimer(){if(timerId!==null){clearInterval(timerId);timerId=null;}}
    function updateTimerControls(){timerLevelEl.disabled=!timedModeEl.checked;}
    function updateTimerDisplay(){if(!timedModeEl.checked||quizCard.classList.contains("hidden")){timerDisplay.classList.add("hidden");return;}timerDisplay.classList.remove("hidden");timerDisplay.textContent=tr().timerDisplay(timeLeft);timerDisplay.classList.toggle("timer-danger",timeLeft<=10);}
    function startTimerForQuestion(){clearTimer();if(!timedModeEl.checked){timerDisplay.classList.add("hidden");return;}timeLeft=TIMER_DURATIONS[timerLevelEl.value]||60;updateTimerDisplay();timerId=setInterval(()=>{timeLeft-=1;updateTimerDisplay();if(timeLeft<=0)handleTimeUp();},1000);}
    function applyLanguage(){
      lang=readGlobalLanguage();const t=tr();document.documentElement.lang=t.htmlLang;document.title=t.title;
      document.querySelectorAll("[data-i18n]").forEach(el=>{const key=el.getAttribute("data-i18n");if(t[key])el.textContent=t[key];});
      document.getElementById("toolBadge").textContent=t.toolBadge;document.getElementById("pageTitle").textContent=t.title;document.getElementById("pageSubtitle").textContent=t.subtitle;
      document.getElementById("setupTitle").textContent=t.setupTitle;document.getElementById("difficultyLabel").textContent=t.difficultyLabel;document.getElementById("questionCountLabel").textContent=t.questionCountLabel;document.getElementById("optionCountLabel").textContent=t.optionCountLabel;document.getElementById("timedModeText").textContent=t.timedModeText;document.getElementById("timedModeHint").textContent=t.timedModeHint;document.getElementById("timerLevelLabel").textContent=t.timerLevelLabel;
      startBtn.textContent=t.startBtn;sampleBtn.textContent=t.sampleBtn;document.getElementById("noteBox").textContent=t.note;qTitle.textContent=t.questionTitle;quitBtn.textContent=t.quitBtn;document.getElementById("resultTitle").textContent=t.resultTitle;document.getElementById("scoreLabel").textContent=t.scoreLabel;document.getElementById("accuracyLabel").textContent=t.accuracyLabel;document.getElementById("wrongLabel").textContent=t.wrongLabel;document.getElementById("wrongReviewTitle").textContent=t.wrongReviewTitle;restartBtn.textContent=t.restartBtn;reviewWrongBtn.textContent=t.reviewWrongBtn;
      rebuildDifficultyOptions();rebuildOptionCountOptions();rebuildTimerLevelOptions();updateTimerControls();
      if(quiz.length>0&&!quizCard.classList.contains("hidden"))renderQuestion(false);if(!resultCard.classList.contains("hidden"))renderResultBody();if(lastFeedback){renderFeedback(lastFeedback.correct,lastFeedback.answer,lastFeedback.timeUp);renderSolutionBox();}updateTimerDisplay();
    }
    function rebuildDifficultyOptions(){const cur=difficultyEl.value||"medium";difficultyEl.innerHTML="";["easy","medium","hard","expert","hell","mixed"].forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=tr().difficultyOptions[v];difficultyEl.appendChild(o);});difficultyEl.value=tr().difficultyOptions[cur]?cur:"medium";}
    function rebuildOptionCountOptions(){const cur=optionCountEl.value||"4";optionCountEl.innerHTML="";[4,5,6].forEach(v=>{const o=document.createElement("option");o.value=String(v);o.textContent=tr().optionCount(v);optionCountEl.appendChild(o);});optionCountEl.value=cur;}
    function rebuildTimerLevelOptions(){const cur=timerLevelEl.value||"timer_medium";timerLevelEl.innerHTML="";["timer_easy","timer_medium","timer_hard","timer_expert","timer_hell"].forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=tr().timerOptions[v];timerLevelEl.appendChild(o);});timerLevelEl.value=TIMER_DURATIONS[cur]?cur:"timer_medium";}
    function answerKey(a){return `${a.kind}:${a.value}`;}
    function answerToString(a){return GAME.answerToString(a);}
    function correctAnswer(q){return q.answer;}
    function isSameAnswer(a,b){return answerKey(a)===answerKey(b);}
    function buildQuiz(){const selectedDifficulty=difficultyEl.value,count=clamp(Number(questionCountEl.value||10),1,100);lastDifficulty=selectedDifficulty;quiz=[];const difficultyPlan=buildDifficultyPlan(count,selectedDifficulty);for(let i=0;i<count;i++)quiz.push(GAME.generateQuestion(difficultyPlan[i]));currentIndex=0;correctCount=0;wrongAnswers=[];answered=false;lastFeedback=null;showQuiz();renderQuestion(true);}
    function buildWrongTypeQuiz(){if(wrongAnswers.length===0){alert(tr().noWrongAlert);return;}const count=Math.max(wrongAnswers.length*2,5);quiz=[];for(let i=0;i<count;i++){const source=choose(wrongAnswers);const difficulty=lastDifficulty==="mixed"?source.difficulty:lastDifficulty;quiz.push(GAME.generateQuestion(difficulty,source.type));}currentIndex=0;correctCount=0;wrongAnswers=[];answered=false;lastFeedback=null;showQuiz();renderQuestion(true);}
    function showQuiz(){setupCard.classList.add("hidden");resultCard.classList.add("hidden");quizCard.classList.remove("hidden");}
    function renderQuestion(resetOptions){const q=quiz[currentIndex];if(!q)return;if(resetOptions){answered=false;lastFeedback=null;feedbackEl.textContent="";feedbackEl.className="feedback";solutionBox.classList.add("hidden");solutionBox.innerHTML="";nextBtn.disabled=true;}progressText.textContent=tr().progress(currentIndex+1,quiz.length);difficultyText.textContent=lastDifficulty==="mixed"?`${tr().difficulties.mixed} · ${tr().difficulties[q.difficulty]}`:tr().difficulties[q.difficulty];progressBar.style.width=`${(currentIndex/quiz.length)*100}%`;qTitle.textContent=tr().questionTitle;renderMaybeMath(qMain,q.main,true);qExtra.textContent="";qExtra.classList.add("hidden");if(resetOptions){optionsEl.innerHTML="";q.options.forEach(opt=>{const btn=document.createElement("button");btn.className="option";btn.dataset.answerKey=answerKey(opt);btn.setAttribute("aria-label",answerToString(opt));renderMaybeMath(btn,answerToString(opt));btn.addEventListener("click",()=>chooseOption(btn,opt));optionsEl.appendChild(btn);});}nextBtn.textContent=currentIndex===quiz.length-1?tr().resultBtn:tr().nextBtn;if(resetOptions)startTimerForQuestion();else updateTimerDisplay();}
    function renderFeedback(correct,answer,timeUp=false){feedbackEl.className="feedback";if(correct){feedbackEl.textContent=tr().correctFeedback;feedbackEl.classList.add("good");}else{const prefix=timeUp?(lang==="zh"?"时间到。正确答案是":"Time is up. The correct answer is"):(lang==="zh"?"错误。正确答案是":"Incorrect. The correct answer is");feedbackEl.innerHTML=`${prefix} ${mathSpan(answer,"feedback-math")}.`;renderTaggedMath(feedbackEl);feedbackEl.classList.add("bad");}}
    function renderSolutionBox(){const q=quiz[currentIndex];if(!q||!answered){solutionBox.classList.add("hidden");solutionBox.innerHTML="";return;}const lines=GAME.solutionLines(q);const correct=answerToString(correctAnswer(q));solutionBox.classList.remove("hidden");solutionBox.innerHTML=`<h4>${tr().solutionTitle}</h4><div class="solution-chain">${lines.map(s=>`<div class="chain-line">${mathSpan(s.line,"chain-math")}<span class="chain-note">${escapeHtml(s.note||"")}</span></div>`).join("")}</div><div class="solution-answer">${tr().solutionFinal} ${mathSpan(correct,"answer-math")}</div>`;renderTaggedMath(solutionBox);}
    function chooseOption(button,selected){if(answered)return;answered=true;clearTimer();const q=quiz[currentIndex],correct=correctAnswer(q),correctDisplay=answerToString(correct),buttons=[...optionsEl.querySelectorAll(".option")];buttons.forEach(btn=>{btn.disabled=true;if(btn.dataset.answerKey===answerKey(correct))btn.classList.add("correct");});if(isSameAnswer(selected,correct)){correctCount++;lastFeedback={correct:true,answer:correctDisplay,timeUp:false};renderFeedback(true,correctDisplay,false);}else{button.classList.add("wrong");lastFeedback={correct:false,answer:correctDisplay,timeUp:false};renderFeedback(false,correctDisplay,false);wrongAnswers.push({main:q.plain||q.main.replace(/<[^>]+>/g,""),answer:correctDisplay,selected:answerToString(selected),type:q.type,difficulty:q.difficulty});}void window.MCLProgress?.recordGameAttempt?.({question:q,correctAnswer:correctDisplay,selectedAnswer:answerToString(selected),isCorrect:isSameAnswer(selected,correct)});renderSolutionBox();nextBtn.disabled=false;progressBar.style.width=`${((currentIndex+1)/quiz.length)*100}%`;}
    function handleTimeUp(){if(answered)return;clearTimer();answered=true;const q=quiz[currentIndex],correct=correctAnswer(q),correctDisplay=answerToString(correct),buttons=[...optionsEl.querySelectorAll(".option")];buttons.forEach(btn=>{btn.disabled=true;if(btn.dataset.answerKey===answerKey(correct))btn.classList.add("correct");});lastFeedback={correct:false,answer:correctDisplay,timeUp:true};renderFeedback(false,correctDisplay,true);wrongAnswers.push({main:q.plain||q.main.replace(/<[^>]+>/g,""),answer:correctDisplay,selected:null,timeUp:true,type:q.type,difficulty:q.difficulty});void window.MCLProgress?.recordGameAttempt?.({question:q,correctAnswer:correctDisplay,selectedAnswer:"",isCorrect:false,timeUp:true});renderSolutionBox();nextBtn.disabled=false;progressBar.style.width=`${((currentIndex+1)/quiz.length)*100}%`;}
    function nextQuestion(){if(!answered)return;if(currentIndex<quiz.length-1){currentIndex++;renderQuestion(true);}else showResult();}
    function showResult(){clearTimer();quizCard.classList.add("hidden");resultCard.classList.remove("hidden");renderResultBody();}
    function renderResultBody(){const total=Math.min(quiz.length,currentIndex+(answered?1:0)),accuracy=total===0?0:Math.round((correctCount/total)*100);scoreNum.textContent=`${correctCount}/${total}`;accuracyNum.textContent=`${accuracy}%`;wrongNum.textContent=`${wrongAnswers.length}`;wrongList.innerHTML="";if(wrongAnswers.length===0){const item=document.createElement("div");item.className="wrong-item";item.innerHTML=`<div class="expr">${tr().noWrong}</div><p class="tag-good">${tr().noWrongTip}</p>`;wrongList.appendChild(item);}else{wrongAnswers.forEach((w,i)=>{const item=document.createElement("div");item.className="wrong-item";item.innerHTML=`<div class="expr">${i+1}. ${escapeHtml(w.main)}</div><p>${tr().yourAnswer}: <span class="tag-bad">${escapeHtml(w.timeUp?tr().timeUpAnswer:w.selected)}</span></p><p>${tr().correctAnswer}: <span class="tag-good">${escapeHtml(w.answer)}</span></p><p>${tr().suggestion}</p>`;wrongList.appendChild(item);});}}
    function resetToSetup(){clearTimer();setupCard.classList.remove("hidden");quizCard.classList.add("hidden");resultCard.classList.add("hidden");progressBar.style.width="0%";sampleBox.classList.add("hidden");sampleBox.innerHTML="";solutionBox.classList.add("hidden");solutionBox.innerHTML="";lastFeedback=null;}
    function quitQuiz(){if(answered||currentIndex>0)showResult();else resetToSetup();}
    function showSample(){const sampleDifficulty=pickDifficultyForSample(difficultyEl.value);const q=GAME.generateQuestion(sampleDifficulty),correct=answerToString(correctAnswer(q));sampleBox.classList.remove("hidden");sampleBox.innerHTML=`<strong>${tr().sampleTitle}:</strong><br>${tr().sampleQuestion}: <code>${escapeHtml(q.plain||q.main.replace(/<[^>]+>/g,""))}</code><br>${tr().sampleAnswer}: <code>${escapeHtml(correct)}</code><br>${tr().sampleOptions}: ${q.options.map(x=>`<code>${escapeHtml(answerToString(x))}</code>`).join(" ")}`;}
    timedModeEl.addEventListener("change",updateTimerControls);startBtn.addEventListener("click",buildQuiz);sampleBtn.addEventListener("click",showSample);nextBtn.addEventListener("click",nextQuestion);quitBtn.addEventListener("click",quitQuiz);restartBtn.addEventListener("click",resetToSetup);reviewWrongBtn.addEventListener("click",buildWrongTypeQuiz);applyLanguage();
