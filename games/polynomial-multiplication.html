  <script>
    function tag(type, fn){ fn.__type = type; return fn; }
    function term(coef, powers = {}){
      const clean = {};
      Object.keys(powers).forEach(v => { if (powers[v]) clean[v] = powers[v]; });
      return { coef, powers: clean };
    }
    function keyForPowers(powers){ return Object.keys(powers).sort().map(v => `${v}:${powers[v]}`).join("|"); }
    function normalize(terms){
      const map = new Map();
      terms.forEach(t => {
        if (!t || !t.coef) return;
        const key = keyForPowers(t.powers || {});
        const prev = map.get(key) || { coef: 0, powers: t.powers || {} };
        prev.coef += t.coef;
        map.set(key, prev);
      });
      return [...map.values()].filter(t => t.coef !== 0).sort(compareTerms);
    }
    function compareTerms(a, b){
      const da = degree(a), db = degree(b);
      if (db !== da) return db - da;
      const ax = a.powers.x || 0, bx = b.powers.x || 0;
      if (bx !== ax) return bx - ax;
      const ay = a.powers.y || 0, by = b.powers.y || 0;
      if (by !== ay) return by - ay;
      return keyForPowers(a.powers).localeCompare(keyForPowers(b.powers));
    }
    function degree(t){ return Object.values(t.powers || {}).reduce((s, n) => s + n, 0); }
    function poly(terms){ const normalized = normalize(terms); return { terms: normalized, latex: polyLatex(normalized), key: polyKey(normalized) }; }
    function polyKey(terms){ return normalize(terms).map(t => `${t.coef}:${keyForPowers(t.powers)}`).join(","); }
    function varLatex(v, e){ return e === 1 ? v : `${v}^{${e}}`; }
    function monoBody(absCoef, powers){
      const vars = Object.keys(powers).sort().filter(v => powers[v] > 0).map(v => varLatex(v, powers[v])).join("");
      if (!vars) return String(absCoef);
      return `${absCoef === 1 ? "" : absCoef}${vars}`;
    }
    function polyLatex(terms){
      const normalized = normalize(terms);
      if (!normalized.length) return "0";
      return normalized.map((t, i) => {
        const abs = Math.abs(t.coef);
        const body = monoBody(abs, t.powers || {});
        if (i === 0) return t.coef < 0 ? `-${body}` : body;
        return t.coef < 0 ? `-${body}` : `+${body}`;
      }).join("");
    }
    function factorLatex(p){ return p.terms.length === 1 ? p.latex : `\\left(${p.latex}\\right)`; }
    function add(a, b){ return poly([...(a.terms || []), ...(b.terms || [])]); }
    function scale(a, k){ return poly((a.terms || []).map(t => term(t.coef * k, t.powers))); }
    function multiply(a, b){
      const out = [];
      (a.terms || []).forEach(left => (b.terms || []).forEach(right => {
        const powers = { ...(left.powers || {}) };
        Object.keys(right.powers || {}).forEach(v => { powers[v] = (powers[v] || 0) + right.powers[v]; });
        out.push(term(left.coef * right.coef, powers));
      }));
      return poly(out);
    }
    function p1(...coeffs){
      const degree = coeffs.length - 1;
      return poly(coeffs.map((c, i) => term(c, degree - i ? { x: degree - i } : {})));
    }
    function mono(coef, powers){ return poly([term(coef, powers)]); }
    function xBinomial(a, b){ return p1(a, b); }
    function xTrinomial(a, b, c){ return p1(a, b, c); }
    function twoVarBinomial(cx, cy, sign = 1){ return poly([term(cx, { x: 1 }), term(sign * cy, { y: 1 })]); }
    function make(type, mainPoly, factors, answer, distractors, noteKeys){
      const main = factors.map(factorLatex).join("\\cdot ");
      const notes = tr().notes;
      const distribution = distributionLine(factors);
      const lines = [
        { line: main, note: notes.setup },
        { line: distribution, note: notes.distribute },
        { line: answer.latex, note: notes.combine }
      ];
      if (noteKeys && noteKeys.final) lines.push({ line: answer.latex, note: notes.final });
      return { type, promptKey:"promptExpand", main, plain:main, answer, distractors, lines };
    }
    function distributionLine(factors){
      if (factors.length !== 2) return factors.map(factorLatex).join("\\cdot ");
      const [a, b] = factors;
      const pieces = [];
      a.terms.forEach(left => b.terms.forEach(right => pieces.push(polyLatex([term(left.coef * right.coef, mergePowers(left.powers, right.powers))]))));
      return pieces.join("+").replace(/\+\-/g, "-");
    }
    function mergePowers(a, b){ const out = { ...(a || {}) }; Object.keys(b || {}).forEach(v => { out[v] = (out[v] || 0) + b[v]; }); return out; }
    function replaceCoefficient(p, index, coefficient){
      if (!p.terms.length || index < 0 || index >= p.terms.length) return null;
      return poly(p.terms.map((t, i) => term(i === index ? coefficient : t.coef, t.powers)));
    }
    function omitTerm(p, index){
      if (p.terms.length < 2 || index < 0 || index >= p.terms.length) return null;
      return poly(p.terms.filter((_, i) => i !== index));
    }
    function wrongChoices(factors, answer, extras = []){
      const [a, b] = factors;
      const last = Math.max(0, answer.terms.length - 1);
      const firstCoef = answer.terms[0]?.coef || 1;
      const lastCoef = answer.terms[last]?.coef || 1;
      const choices = [
        ...extras,
        a && b ? add(a, b) : null,
        scale(answer, -1),
        a && b ? multiply(scale(a, -1), b) : null,
        replaceCoefficient(answer, 0, -firstCoef),
        replaceCoefficient(answer, last, -lastCoef),
        omitTerm(answer, last),
        replaceCoefficient(answer, 0, firstCoef + (firstCoef > 0 ? 1 : -1)),
        replaceCoefficient(answer, last, lastCoef + (lastCoef > 0 ? 1 : -1))
      ].filter(Boolean);
      const unique = new Map();
      choices.forEach(choice => {
        if (choice.key !== answer.key && !unique.has(choice.key)) unique.set(choice.key, choice);
      });
      return [...unique.values()].slice(0, 5);
    }

    const B = {
