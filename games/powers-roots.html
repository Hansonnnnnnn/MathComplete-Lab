  <script>
    function tag(type, fn){ fn.__type = type; return fn; }
    function make(type, promptKey, main, answer, distractors, lines){
      return { type, promptKey, main, plain:main, answer:String(answer), distractors:distractors.map(String), lines };
    }
    function evaluate(type, main, answer, distractors, work){
      return make(type, "promptEvaluate", main, answer, distractors, [
        {line:work,note:tr().notes.compute},
        {line:String(answer),note:tr().notes.final}
      ]);
    }
    function nearby(answer, values=[]){
      const candidates=[...values,answer+1,answer-1,answer+2,answer-2,-answer];
      return [...new Set(candidates.filter(value => Number.isFinite(value) && value !== answer))].slice(0,5);
    }
    const T = {
      en:{
        toolBadge:"Pre-Algebra", title:"Powers & Roots Practice",
        subtitle:"Build fluency with powers, square roots, cube roots, perfect powers, and mixed numerical expressions.",
        note:"All roots are exact whole numbers or simple fractions. No calculator approximations are required.",
        questionTitle:"Choose the correct answer.",
        promptEvaluate:"Evaluate.",
        promptFindBase:"Find the positive missing number.",
        difficultyOptions:{easy:"Easy: squares, cubes, square roots, and cube roots",medium:"Medium: higher powers, negative bases, and missing values",hard:"Hard: order of operations and nested roots",expert:"Expert: mixed powers, roots, and fractions",mixed:"Mixed: balanced practice from all levels"},
        suggestion:"Suggestion: identify the base and exponent first, and remember that roots undo matching powers.",
        notes:{compute:"compute the power or root",inverse:"use the inverse relationship",order:"follow the order of operations",final:"final value"}
      },
      zh:{
        toolBadge:"é¢„å¤‡ä»£æ•°", title:"å¹‚ä¸Žæ ¹ä¸“é¡¹ç»ƒä¹ ",
        subtitle:"ç»ƒä¹ æ•´æ•°å¹‚ã€å¹³æ–¹æ ¹ã€ç«‹æ–¹æ ¹ã€å®Œå…¨å¹‚ä»¥åŠå¹‚ä¸Žæ ¹çš„æ··åˆæ•°å€¼è¿ç®—ã€‚",
        note:"æ‰€æœ‰æ ¹å¼éƒ½èƒ½å¾—åˆ°ç²¾ç¡®æ•´æ•°æˆ–ç®€å•åˆ†æ•°ï¼Œä¸éœ€è¦ä½¿ç”¨å°æ•°è¿‘ä¼¼ã€‚",
        questionTitle:"é€‰æ‹©æ­£ç¡®ç­”æ¡ˆã€‚",
        promptEvaluate:"è®¡ç®—ã€‚",
        promptFindBase:"æ±‚æ­£çš„ç©ºç¼ºæ•°ã€‚",
        difficultyOptions:{easy:"ç®€å•ï¼šå¹³æ–¹ã€ç«‹æ–¹ã€å¹³æ–¹æ ¹å’Œç«‹æ–¹æ ¹",medium:"ä¸­ç­‰ï¼šè¾ƒé«˜æ¬¡å¹‚ã€è´Ÿåº•æ•°å’Œç©ºç¼ºæ•°",hard:"å›°éš¾ï¼šè¿ç®—é¡ºåºå’ŒåµŒå¥—æ ¹å¼",expert:"ä¸“å®¶ï¼šå¹‚ã€æ ¹ä¸Žåˆ†æ•°ç»¼åˆ",mixed:"æ··åˆï¼šä»Žæ‰€æœ‰éš¾åº¦ä¸­å‡è¡¡å‡ºé¢˜"},
        suggestion:"å»ºè®®ï¼šå…ˆç¡®è®¤åº•æ•°å’ŒæŒ‡æ•°ï¼›å¯¹åº”æ¬¡æ•°çš„æ ¹è¿ç®—ä¸Žå¹‚è¿ç®—äº’ä¸ºé€†è¿ç®—ã€‚",
        notes:{compute:"è®¡ç®—å¹‚æˆ–æ ¹",inverse:"ä½¿ç”¨äº’é€†å…³ç³»",order:"æŒ‰ç…§è¿ç®—é¡ºåº",final:"æœ€ç»ˆç»“æžœ"}
      }
    };
    function tr(){ return T[localStorage.getItem("mathcomplete_lang")==="zh" ? "zh" : "en"]; }
    const B = {
      easy:[
        tag("square", h => { const a=h.randInt(2,15), ans=a*a; return evaluate("square",`${a}^{2}`,ans,nearby(ans,[a*2,a+2]),`${a}\\times ${a}=${ans}`); }),
        tag("cube", h => { const a=h.randInt(2,8), ans=a**3; return evaluate("cube",`${a}^{3}`,ans,nearby(ans,[a*3,a*a]),`${a}\\times ${a}\\times ${a}=${ans}`); }),
        tag("square-root", h => { const a=h.randInt(2,15), n=a*a; return evaluate("square-root",`\\sqrt{${n}}`,a,nearby(a,[n,Math.floor(n/2)]),`${a}^{2}=${n}`); }),
        tag("cube-root", h => { const a=h.randInt(2,8), n=a**3; return evaluate("cube-root",`\\sqrt[3]{${n}}`,a,nearby(a,[a*a,n]),`${a}^{3}=${n}`); })
      ],
      medium:[
        tag("higher-power", h => { const a=h.randInt(2,5), p=h.randInt(4,5), ans=a**p; return evaluate("higher-power",`${a}^{${p}}`,ans,nearby(ans,[a*p,a**(p-1)]),`${Array(p).fill(a).join("\\times ")}=${ans}`); }),
        tag("negative-base", h => { const a=h.randInt(2,8), p=h.randInt(2,5), ans=(-a)**p; return evaluate("negative-base",`\\left(-${a}\\right)^{${p}}`,ans,nearby(ans,[a**p,-a*p]),p%2===0?`\\text{even exponent}\\Rightarrow ${ans}`:`\\text{odd exponent}\\Rightarrow ${ans}`); }),
        tag("missing-square", h => { const a=h.randInt(3,18), n=a*a; return make("missing-square","promptFindBase",`\\Box^{2}=${n}`,a,nearby(a,[n]),[{line:`\\sqrt{${n}}=${a}`,note:tr().notes.inverse},{line:String(a),note:tr().notes.final}]); }),
        tag("missing-cube", h => { const a=h.randInt(2,10), n=a**3; return make("missing-cube","promptFindBase",`\\Box^{3}=${n}`,a,nearby(a,[a*a,n]),[{line:`\\sqrt[3]{${n}}=${a}`,note:tr().notes.inverse},{line:String(a),note:tr().notes.final}]); })
      ],
      hard:[
        tag("power-plus-root", h => { const a=h.randInt(2,9), b=h.randInt(2,12), ans=a*a+b; return evaluate("power-plus-root",`${a}^{2}+\\sqrt{${b*b}}`,ans,nearby(ans,[a*2+b,a*a+b*b]),`${a*a}+${b}=${ans}`); }),
        tag("root-times-power", h => { const a=h.randInt(2,10), b=h.randInt(2,6), ans=a*b*b; return evaluate("root-times-power",`\\sqrt{${a*a}}\\cdot ${b}^{2}`,ans,nearby(ans,[a+b*b,a*a*b]),`${a}\\cdot ${b*b}=${ans}`); }),
        tag("nested-power-root", h => { const a=h.randInt(2,8), ans=a*a; return evaluate("nested-power-root",`\\sqrt[3]{\\left(${a}^{3}\\right)^{2}}`,ans,nearby(ans,[a,a**3]),`\\sqrt[3]{${a}^{6}}=${a}^{2}=${ans}`); }),
        tag("fourth-root", h => { const a=h.randInt(2,9), n=a**4; return evaluate("fourth-root",`\\sqrt[4]{${n}}`,a,nearby(a,[a*a,a**3]),`${a}^{4}=${n}`); })
      ],
      expert:[
        tag("pythagorean-root", h => { const triple=h.choice([[3,4,5],[5,12,13],[6,8,10],[8,15,17]]), a=triple[0],b=triple[1],c=triple[2]; return evaluate("pythagorean-root",`\\sqrt{${a}^{2}+${b}^{2}}`,c,nearby(c,[a+b,a*b]),`\\sqrt{${a*a}+${b*b}}=\\sqrt{${c*c}}=${c}`); }),
        tag("cube-root-expression", h => { const a=h.randInt(2,7), b=h.randInt(2,7), ans=a+b; return evaluate("cube-root-expression",`\\sqrt[3]{${a**3}}+\\sqrt[3]{${b**3}}`,ans,nearby(ans,[a*b,a**3+b**3]),`${a}+${b}=${ans}`); }),
        tag("fraction-power", h => { const pair=h.choice([[2,3],[2,5],[3,4],[3,5],[4,5],[5,6],[5,7]]), a=pair[0], b=pair[1], ans=`\\frac{${a*a}}{${b*b}}`; return make("fraction-power","promptEvaluate",`\\left(\\frac{${a}}{${b}}\\right)^{2}`,ans,[`\\frac{${a}}{${b*b}}`,`\\frac{${a*a}}{${b}}`,`\\frac{${2*a}}{${2*b}}`,`\\frac{${a+b}}{${b*b}}`],[{line:`\\frac{${a}^{2}}{${b}^{2}}`,note:tr().notes.compute},{line:ans,note:tr().notes.final}]); }),
        tag("mixed-order", h => { const a=h.randInt(2,7), b=h.randInt(2,7), c=h.randInt(2,5), ans=a*a-b+c**3; return evaluate("mixed-order",`${a}^{2}-\\sqrt{${b*b}}+${c}^{3}`,ans,nearby(ans,[a*2-b+c*3,a*a-b*b+c**3]),`${a*a}-${b}+${c**3}=${ans}`); })
      ]
    };
    window.MCLQuizTool = { text:T, builders:B };
  </script>
