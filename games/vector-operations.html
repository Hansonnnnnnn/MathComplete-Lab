    function readGlobalLanguage() { return localStorage.getItem("mathcomplete_lang") === "zh" ? "zh" : "en"; }
    function tr() { return T[lang]; }
    function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
    function choose(arr) { return arr[randInt(0, arr.length - 1)]; }
    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = randInt(0, i);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    function formatTime(s) { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
    function escapeHtml(text) { return String(text).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;"); }
    function renderLatex(el, latex, displayMode = false) {
      el.classList.add("math-render");
      if (window.katex) katex.render(latex, el, { throwOnError: false, displayMode });
      else el.textContent = latex;
    }
    function mathSpan(latex, cls = "") { return `<span${cls ? ` class="${cls}"` : ""} data-latex="${escapeHtml(latex)}"></span>`; }
    function renderTaggedMath(root) { root.querySelectorAll("[data-latex]").forEach(el => renderLatex(el, el.getAttribute("data-latex") || "")); }
    function textOption(code) { return { kind: "text", key: `text:${code}`, code }; }
    function mathOption(key, latex) { return { kind: "math", key, latex }; }
    function scalarOption(n) { return mathOption(`scalar:${n}`, String(n)); }
    function noSolutionOption() { return textOption("noSolution"); }
    function optKey(option) { return option.key; }
    function optionText(option) {
      if (option.kind === "text") return tr().textOptions[option.code] || option.code;
      return option.latex;
    }
    function optionToHtml(option, cls = "answer-math") {
      if (option.kind === "text") return `<span class="${cls}">${escapeHtml(optionText(option))}</span>`;
      return mathSpan(option.latex, cls);
    }
    function renderOptionElement(el, option) {
      el.innerHTML = "";
      if (option.kind === "text") el.textContent = optionText(option);
      else renderLatex(el, option.latex, false);
    }
    function isSameAnswer(a, b) { return optKey(a) === optKey(b); }
    function vecKey(v) { return v.join(","); }
    function vecLatex(v) { return `\\langle ${v.join(",")} \\rangle`; }
    function vecOption(v) { return mathOption(`vec${v.length}:${vecKey(v)}`, vecLatex(v)); }
    function addVec(a, b) { return a.map((x, i) => x + b[i]); }
    function subVec(a, b) { return a.map((x, i) => x - b[i]); }
    function mulVec(k, v) { return v.map(x => k * x); }
    function addMany(vecs) { return vecs.reduce((acc, v) => addVec(acc, v), Array(vecs[0].length).fill(0)); }
    function negVec(v) { return v.map(x => -x); }
    function randNonzero(a, b) { let n = 0; while (n === 0) n = randInt(a, b); return n; }
    function randVec(dim, min = -6, max = 6, nonzero = false) {
      let v = Array.from({ length: dim }, () => randInt(min, max));
      if (nonzero) while (v.every(x => x === 0)) v = Array.from({ length: dim }, () => randInt(min, max));
      return v;
    }
    function pointLatex(p) { return `(${p.join(",")})`; }
    function vectorFromPoints(A, B) { return B.map((x, i) => x - A[i]); }
    function signedCoeff(k, variable, first = false) {
      const abs = Math.abs(k);
      const body = abs === 1 ? variable : `${abs}${variable}`;
      if (first) return k < 0 ? `-${body}` : body;
      return k < 0 ? `-${body}` : `+${body}`;
    }
    function coeffExpr(terms) {
      return terms.map((t, i) => signedCoeff(t.k, t.name, i === 0)).join(" ").replace(/\+\-/g, "-");
    }
    function linearCombo(terms) {
      const dim = terms[0].v.length;
      let out = Array(dim).fill(0);
      terms.forEach(t => { out = addVec(out, mulVec(t.k, t.v)); });
      return out;
    }

    function vectorDistractors(correct, extras = []) {
      const dim = correct.length;
      const items = [];
      const add = v => {
        if (!Array.isArray(v) || v.length !== dim) return;
        const option = vecOption(v);
        if (option.key !== vecOption(correct).key && !items.some(x => x.key === option.key)) items.push(option);
      };
      extras.forEach(add);
      add(correct.map((x, i) => i === 0 ? -x : x));
      add(correct.map((x, i) => i === dim - 1 ? -x : x));
      add(correct.map(x => x + 1));
      add(correct.map(x => x - 1));
      if (dim === 2) add([correct[1], correct[0]]);
      if (dim === 3) add([correct[1], correct[0], correct[2]]);
      while (items.length < 8) add(correct.map(x => x + randNonzero(-3, 3)));
      return items;
    }
    function scalarDistractors(correct, extras = []) {
      const items = [];
      const add = n => {
        const option = Number.isFinite(n) ? scalarOption(n) : noSolutionOption();
        if (option.key !== scalarOption(correct).key && !items.some(x => x.key === option.key)) items.push(option);
      };
      extras.forEach(add);
      [correct + 1, correct - 1, -correct, correct + 2, correct - 2, 0, 1, -1].forEach(add);
      while (items.length < 8) add(correct + randNonzero(-5, 5));
      return items;
    }
    function textDistractors(correct, pool) {
      const used = new Set([correct.key]);
      return pool.filter(x => {
        if (used.has(x.key)) return false;
        used.add(x.key);
        return true;
      });
    }
    function generateOptions(q, count) {
      const map = new Map();
      const add = opt => { if (opt && opt.key !== q.answer.key && !map.has(opt.key)) map.set(opt.key, opt); };
      (q.distractors || []).forEach(add);
      const fallbacks = fallbackOptions(q);
      fallbacks.forEach(add);
      return shuffle([q.answer, ...shuffle([...map.values()]).slice(0, count - 1)]);
    }
    function fallbackOptions(q) {
      if (q.answerKind === "vector2" || q.answerKind === "vector3") return vectorDistractors(q.answerVector || [0, 0]);
      if (q.answerKind === "scalar") return scalarDistractors(q.answerScalar || 0).concat([noSolutionOption()]);
      if (q.answerKind === "defined") return [textOption("definedSameDim"), textOption("undefinedDim"), textOption("undefinedScalar"), textOption("definedScalar")];
      if (q.answerKind === "type") return [textOption("vector"), textOption("scalar"), textOption("matrix"), textOption("undefined")];
      if (q.answerKind === "statement" || q.answerKind === "identity") return q.statementPool || [];
      return [];
    }

        lines: config.lines || [],

        statementPool: config.statementPool || []

      q.options = generateOptions(q, Number(optionCountEl.value || 4));
      return q;

      if (!q) { solutionBox.classList.add("hidden"); solutionBox.innerHTML = ""; return; }
      solutionBox.classList.remove("hidden");
      solutionBox.innerHTML = `<h4>${tr().solutionTitle}</h4><div class="solution-chain">${q.lines.map(step => `<div class="chain-line">${mathSpan(step.line, "chain-math")}<span class="chain-note">${escapeHtml(step.note || "")}</span></div>`).join("")}</div><div class="solution-answer">${tr().solutionFinal} ${optionToHtml(q.answer, "answer-math")}</div>`;
      renderTaggedMath(solutionBox);
    }
    function recordAttempt(q, correctDisplay, selectedDisplay, isCorrect, timeUp = false) {
      void window.MCLProgress?.recordGameAttempt?.({ gameId: TOOL_CONFIG.gameId, question: { plain: q.plain, type: q.type, difficulty: q.difficulty }, course: TOOL_CONFIG.course, topic: q.type, correctAnswer: correctDisplay, selectedAnswer: selectedDisplay, isCorrect, timeUp });
    }
    function chooseOption(button, selected) {
      if (answered) return;
      answered = true; clearTimer();
      const q = quiz[currentIndex];
      const isCorrect = isSameAnswer(selected, q.answer);
      [...optionsEl.querySelectorAll(".option")].forEach(btn => { btn.disabled = true; if (btn.dataset.answerKey === optKey(q.answer)) btn.classList.add("correct"); });
      if (isCorrect) { correctCount += 1; renderFeedback(true, q.answer, false); }
      else { button.classList.add("wrong"); renderFeedback(false, q.answer, false); wrongAnswers.push({ main: q.plain, answer: optionText(q.answer), selected: optionText(selected), type: q.type, difficulty: q.difficulty }); }
      recordAttempt(q, optionText(q.answer), optionText(selected), isCorrect, false);
      renderSolutionBox(); nextBtn.disabled = false; progressBar.style.width = `${((currentIndex + 1) / quiz.length) * 100}%`;
    }
    function handleTimeUp() {
      if (answered) return;
      clearTimer(); answered = true;
      const q = quiz[currentIndex];
      [...optionsEl.querySelectorAll(".option")].forEach(btn => { btn.disabled = true; if (btn.dataset.answerKey === optKey(q.answer)) btn.classList.add("correct"); });
      renderFeedback(false, q.answer, true);
      wrongAnswers.push({ main: q.plain, answer: optionText(q.answer), selected: null, timeUp: true, type: q.type, difficulty: q.difficulty });
      recordAttempt(q, optionText(q.answer), "", false, true);
      renderSolutionBox(); nextBtn.disabled = false; progressBar.style.width = `${((currentIndex + 1) / quiz.length) * 100}%`;
    }
    function nextQuestion() { if (!answered) return; if (currentIndex < quiz.length - 1) { currentIndex += 1; renderQuestion(true); } else showResult(); }
    function showResult() { clearTimer(); quizCard.classList.add("hidden"); resultCard.classList.remove("hidden"); renderResultBody(); }
    function renderResultBody() {
      const total = Math.min(quiz.length, currentIndex + (answered ? 1 : 0));
      const accuracy = total ? Math.round((correctCount / total) * 100) : 0;
      scoreNum.textContent = `${correctCount}/${total}`;
      accuracyNum.textContent = `${accuracy}%`;
      wrongNum.textContent = String(wrongAnswers.length);
      if (!wrongAnswers.length) {
        wrongList.innerHTML = `<div class="wrong-item"><div class="expr">${escapeHtml(tr().noWrong)}</div><p>${escapeHtml(tr().noWrongTip)}</p></div>`;
        reviewWrongBtn.disabled = true;
        return;
      }
      reviewWrongBtn.disabled = false;
      wrongList.innerHTML = wrongAnswers.map(item => `<div class="wrong-item"><div class="expr">${mathSpan(item.main, "wrong-math")}</div><p><span class="tag-bad">${escapeHtml(tr().yourAnswer)}:</span> ${escapeHtml(item.timeUp ? tr().timeUpAnswer : item.selected)}</p><p><span class="tag-good">${escapeHtml(tr().correctAnswer)}:</span> ${escapeHtml(item.answer)}</p></div>`).join("");
      renderTaggedMath(wrongList);
    }
    function startRound(forcedTypes = null) {
      clearTimer();
      lastDifficulty = difficultyEl.value || "medium";
      const count = Math.max(1, Math.min(100, Number(questionCountEl.value || 10)));
      questionCountEl.value = String(count);
      const plan = buildDifficultyPlan(count, lastDifficulty);
      quiz = plan.map((diff, i) => buildQuestion(diff, forcedTypes ? forcedTypes[i % forcedTypes.length] : null));
      currentIndex = 0; correctCount = 0; wrongAnswers = [];
      setupCard.classList.add("hidden"); resultCard.classList.add("hidden"); quizCard.classList.remove("hidden");
      renderQuestion(true);
    }
    function showSample() {
      const diff = pickDifficultyForSample(difficultyEl.value || "medium");
      const q = buildQuestion(diff);
      sampleBox.classList.remove("hidden");
      sampleBox.innerHTML = `<strong>${tr().sampleTitle}</strong><br>${escapeHtml(tr().sampleQuestion)}: ${mathSpan(q.main, "sample-math")}<br>${escapeHtml(tr().sampleAnswer)}: ${optionToHtml(q.answer, "sample-math")}<br>${escapeHtml(tr().sampleOptions)}: ${q.options.map(opt => opt.kind === "math" ? mathSpan(opt.latex, "sample-math") : escapeHtml(optionText(opt))).join(" &nbsp; ")}`;
      renderTaggedMath(sampleBox);
    }
    function reviewWrongTypes() {
      if (!wrongAnswers.length) return;
      const types = [...new Set(wrongAnswers.map(x => x.type))];
      startRound(types);
    }
    function resetToSetup() { clearTimer(); quizCard.classList.add("hidden"); resultCard.classList.add("hidden"); setupCard.classList.remove("hidden"); progressBar.style.width = "0%"; }

    startBtn.addEventListener("click", () => startRound());
    sampleBtn.addEventListener("click", showSample);
    nextBtn.addEventListener("click", nextQuestion);
    quitBtn.addEventListener("click", showResult);
    restartBtn.addEventListener("click", resetToSetup);
    reviewWrongBtn.addEventListener("click", reviewWrongTypes);
    timedModeEl.addEventListener("change", updateTimerControls);
    window.addEventListener("storage", event => { if (event.key === "mathcomplete_lang") applyLanguage(); });
    applyLanguage();
  </script>
