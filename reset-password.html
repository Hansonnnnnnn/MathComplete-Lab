  <link rel="stylesheet" href="./assets/css/design-system.css?v=20260717.6">

<body>
  <nav class="nav"></nav>
  <main class="auth-simple-page">
    <section class="auth-simple-card">
      <div class="auth-status-icon"><i data-lucide="key-round"></i></div>
      <h1 data-copy="title">Set a new password</h1>
      <p data-copy="lead">Choose a password you have not used for this account before.</p>
      <form id="resetForm">
        <div class="auth-field"><label for="newPassword" data-copy="password">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required><div class="auth-strength" id="resetStrength" data-score="0"><span></span><span></span><span></span><span></span></div></div>
        <div class="auth-field"><label for="confirmPassword" data-copy="confirm">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></div>
        <button class="auth-primary-button" id="resetButton" type="submit" data-copy="submit">Update password</button>
        <div class="auth-message" id="resetMessage" role="status" hidden></div>
      </form>
      <a class="auth-secondary-button" id="invalidLink" href="login.html" hidden data-copy="back">Request another reset link</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2"></script>
